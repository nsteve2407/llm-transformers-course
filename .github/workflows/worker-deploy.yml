name: Deploy chat Worker

# NOTE: the actual "Deploy" step below is skipped (not failed) until the
# CLOUDFLARE_API_TOKEN repo secret is configured (see README "One-time setup
# for the chat widget"). Context generation and tests still run on every
# push, so this workflow stays useful signal even before Cloudflare setup is
# finished -- a red run means the build/tests genuinely broke, not just that
# the secret is missing.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - "modules/**"
      - "scripts/build_chat_context.mjs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate chat context
        run: node ../scripts/build_chat_context.mjs
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Deploy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

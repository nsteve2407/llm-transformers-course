name: Deploy chat Worker

# NOTE: the `push` trigger below will show as a failed run until the
# CLOUDFLARE_API_TOKEN repo secret is configured (see README "One-time setup
# for the chat widget"). That's expected for repos that haven't finished
# Cloudflare setup yet -- it isn't a sign anything is broken.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "worker/**"
      - "modules/**"
      - "scripts/build_chat_context.mjs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate chat context
        run: node ../scripts/build_chat_context.mjs
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker

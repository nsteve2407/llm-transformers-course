# _data/quizzes/12_clip.yml
- type: mcq
  question: "CLIP's training objective computes an N x N matrix of cosine similarities between the N images and N texts in a minibatch, then computes a cross-entropy loss twice: once treating each image's row of similarities as a classification over the N texts, and once treating each text's column of similarities as a classification over the N images, then averages the two. Why average both directions instead of training with only the image-to-text direction?"
  choices:
    - "Averaging two loss terms is required purely for numerical stability during backpropagation, since a single cross-entropy term computed from an N x N similarity matrix would overflow float32 precision once the batch size grows large enough, and splitting the loss into a separate image-to-text term and text-to-image term halves the magnitude of the gradients flowing through each individual backward pass, which is what keeps both terms comfortably under the precision limit"
    - "The text-to-image direction is included only as a form of data augmentation that doubles the effective batch size seen by the image encoder, and has no effect on how well the text embeddings themselves end up separated from one another"
    - "Training only the image-to-text direction pushes each image's embedding to be discriminable against the N-1 negative texts in its row, but gives the text embeddings no corresponding pressure to be individually discriminable against the N-1 negative images in their own column; averaging in the text-to-image direction supplies that reciprocal pressure so both encoders learn an embedding space that supports retrieval symmetrically in either direction"
    - "Only the image-to-text direction is actually used at training time; the text-to-image term is computed solely for logging and monitoring purposes during training and is never included in the gradient at all, despite superficially appearing in the loss formula"
  answer_index: 2
  explanation: "A row of the similarity matrix (one image against all N texts) trains that image's embedding to stand out against the other texts in the batch, but says nothing about whether each individual text embedding is well separated from the other images -- that requires the reciprocal, column-wise comparison. Averaging the image-to-text and text-to-image cross-entropy terms means both encoders receive gradient pressure to be discriminable in both directions, producing an embedding space usable for retrieval either way (image to text or text to image), which is exactly what zero-shot classification later depends on. This has nothing to do with float32 overflow, the text-to-image term is not merely augmentation with no gradient effect, and it genuinely contributes to the loss used for backpropagation, not just to logging."

- type: mcq
  question: "CLIP scales cosine similarities by a learned temperature (logit-scale) parameter before computing the softmax used in its contrastive loss. What problem does this learned scale solve, and why is it learned rather than fixed?"
  choices:
    - "Cosine similarities between L2-normalized embeddings are bounded to a narrow range near [-1, 1], which would otherwise produce an overly soft, low-contrast softmax distribution over the N candidates in a batch; multiplying similarities by a learned temperature before the softmax sharpens that distribution so small true differences in similarity translate into a more peaked probability distribution and a stronger, more informative gradient, and CLIP learns this scale directly during training, since the ideal sharpness shifts over the course of training and with batch size rather than being a single fixed constant"
    - "The temperature parameter rescales images and text captions to a common physical resolution before either encoder processes them, ensuring the image encoder and text encoder receive inputs of comparable dimensionality"
    - "The logit-scale parameter is applied only during inference to convert cosine similarity scores into calibrated probabilities that must sum to one across every possible English word, and plays no role whatsoever in training or in the loss computed on any minibatch"
    - "Temperature exists purely to prevent the two encoders' output dimensionalities from mismatching, since without it the image embedding and text embedding vectors would have different numbers of dimensions and cosine similarity could not be computed between them at all"
  answer_index: 0
  explanation: "Cosine similarity is confined to a narrow numeric range, so feeding raw similarities straight into a softmax produces a distribution that is too flat to give strong gradients even when one candidate is clearly the correct match. Multiplying by a learned scale before the softmax sharpens the distribution, amplifying small real differences in similarity into more confident, more informative probabilities and gradients. CLIP learns this scale as a parameter (rather than hand-fixing it) because the sharpness that works best changes as training progresses and with batch size, so a single fixed constant would be suboptimal throughout training. It has nothing to do with resizing images, is not inference-only, and has no bearing on embedding dimensionality matching."

- type: mcq
  question: "How does CLIP perform zero-shot image classification on a new dataset, given only a list of candidate class names and no labeled training images from that dataset?"
  choices:
    - "Zero-shot classification works by fine-tuning CLIP's text encoder on the specific set of candidate class names for the target dataset before every evaluation run, which is what 'zero-shot' refers to -- zero additional images, though some text-side gradient updates are still required"
    - "Each candidate class name is converted into a one-hot vector by looking it up in a fixed vocabulary CLIP memorized during pretraining, and classification proceeds by nearest-neighbor comparison between this one-hot vector and a one-hot encoding of the image's true label rather than by computing any embedding similarity between the text and the image themselves, so the image encoder's continuous embedding output is not directly involved in producing the final predicted class at all"
    - "The image encoder is discarded entirely at zero-shot inference time, and classification is instead performed by a small classification head trained from scratch on the text embeddings of the candidate class names alone, with no comparison to any image"
    - "Each candidate class name is embedded into a natural-language prompt (e.g. 'a photo of a {class}'), encoded by the frozen text encoder into an embedding, and the image is classified by computing cosine similarity between its frozen image embedding and every candidate class's text embedding, choosing whichever class has the highest similarity -- turning classification into an image-text retrieval problem with no task-specific training at all"
  answer_index: 3
  explanation: "Zero-shot classification reframes the problem as retrieval: each class name is wrapped in a prompt template, encoded by the frozen text encoder, and compared via cosine similarity against the frozen image embedding, with the highest-similarity class chosen as the prediction. Nothing is fine-tuned and no labeled images from the target dataset are used, which is exactly what makes it zero-shot. There is no gradient update to the text encoder, no one-hot vocabulary lookup, and the image encoder is very much still used -- it is the source of the embedding being compared against every candidate class's text embedding."

- type: short
  question: "CLIP's zero-shot accuracy on ImageNet noticeably improves when a bare class name like 'dog' is replaced with a templated prompt like 'a photo of a dog', and improves further when scores from many different prompt templates are ensembled together -- all without updating any of CLIP's weights. Explain why prompt wording alone can change accuracy this much, and what ensembling across templates adds on top of a single good template."
  answer_keywords:
    - "out of distribution relative to the descriptive captions clip was trained on"
    - "wrapping it in a templated sentence better matches the training time text distribution"
    - "ensembling averages the resulting text embeddings across many templates before renormalizing, reducing sensitivity to any single template's idiosyncratic phrasing"
  model_answer: "CLIP was pretrained on full natural-language captions, not bare category words, so a bare label like 'dog' is often out of distribution relative to the descriptive captions CLIP was trained on and can also be ambiguous out of context (a word like 'crane' could mean a bird or a machine). Wrapping it in a templated sentence better matches the training time text distribution the text encoder saw during pretraining, giving the text embedding a form much closer to what the model learned to associate with real photos, and this alone measurably improves zero-shot accuracy without changing any weights. Prompt ensembling goes further: it computes each class's text embedding from many different templates, and ensembling averages the resulting text embeddings across many templates before renormalizing, reducing sensitivity to any single template's idiosyncratic phrasing, so an unlucky choice of one particular wording matters less and the resulting classification is more robust."
  explanation: "A bare word like 'dog' rarely appears alone in the kind of descriptive alt-text and captions CLIP was pretrained on, so it sits out of distribution relative to what the text encoder learned to embed well, and can be ambiguous without surrounding context. Wrapping the class name in a template such as 'a photo of a {class}' brings the text closer to the training-time distribution of full sentences, which alone raises accuracy with zero weight updates -- this is purely a change in what text is fed to an already-frozen encoder. Ensembling many different templates and averaging (then renormalizing) their resulting text embeddings into one class embedding reduces sensitivity to any single template's idiosyncratic wording, smoothing out quirks that any one template might introduce and yielding a more stable, generally more accurate class representation than relying on one best-guess template alone."

- type: mcq
  question: "How does zero-shot evaluation of CLIP differ from linear-probe evaluation, and what does each sacrifice or gain relative to the other?"
  choices:
    - "Zero-shot and linear-probe evaluation are two names for exactly the same procedure -- both involve training a new linear classification layer on top of frozen CLIP features using labeled downstream data -- and the only difference is which paper's terminology is used to describe it"
    - "Zero-shot evaluation classifies images by matching frozen image embeddings against text embeddings of prompted class names, with no additional training or labeled downstream data at all, while linear-probe evaluation trains a new linear classifier on top of CLIP's frozen image features using labeled examples from the target dataset; linear probing generally achieves higher accuracy on a given dataset since it directly fits decision boundaries to that dataset's specific label distribution, but it requires labeled data and a classifier retrained per dataset, sacrificing zero-shot's ability to handle arbitrary new classes without retraining"
    - "Linear-probe evaluation requires no labeled data whatsoever and instead clusters CLIP's frozen image features unsupervised, assigning cluster identities to classes after the fact by majority vote, whereas zero-shot evaluation requires a labeled training set in order to fit its prompt templates"
    - "Zero-shot evaluation fine-tunes every layer of both the image and text encoders on the target dataset's labeled training set, while linear-probe evaluation keeps every layer frozen including the final classification layer, using only the pretrained prompt-matching scores with no adaptation at all"
  answer_index: 1
  explanation: "Zero-shot evaluation uses CLIP exactly as pretrained -- comparing a frozen image embedding against frozen text embeddings of prompted class names, with no labeled downstream data and no new parameters. Linear-probe evaluation instead trains a new linear classifier on top of CLIP's frozen image features using the target dataset's own labeled examples, which typically pushes accuracy higher on that specific dataset since the classifier is fit directly to its label distribution, at the cost of needing labeled data and a separately trained head per dataset -- unlike zero-shot, which handles new classes purely by naming them. Linear probing is not unsupervised clustering, zero-shot evaluation does not fine-tune any encoder weights, and the two are not the same procedure."

- type: mcq
  question: "CLIP's contrastive loss draws its negative examples from other pairs already present in the same training minibatch, with no separate negative-sampling scheme or memory bank. Why does this in-batch negative design make large batch sizes especially important for CLIP's pretraining?"
  choices:
    - "For a given image, every other caption in the batch (and vice versa) serves as a negative; a larger batch supplies far more negatives per update, making the discrimination task harder and forcing embeddings to be more finely separated, and gives a better within-batch approximation of the full contrastive softmax over many distractors, which is why CLIP was trained with very large batch sizes rather than small ones"
    - "Batch size mainly determines how many GPUs are used in parallel during training; the actual negative examples for the contrastive loss are drawn from a separately maintained memory bank of embeddings computed on earlier batches and refreshed periodically over the course of training, so a larger minibatch does not meaningfully change how many negatives a given image-text pair is compared against at any one training step, regardless of how that memory bank happens to be sized"
    - "Large batch sizes are needed solely because CLIP's image encoder has a hard architectural requirement that every forward pass contain at least several thousand images simultaneously, unrelated to the contrastive loss or negative sampling in any way"
    - "Smaller batch sizes actually produce better contrastive representations than large ones, since fewer in-batch negatives make each individual negative's gradient contribution larger and thus more informative per step; CLIP's use of large batches was reported as a compute-budget compromise that the authors explicitly said hurt final accuracy relative to what smaller batches would have achieved"
  answer_index: 0
  explanation: "Because CLIP has no separate negative-mining or memory-bank mechanism, every other example in the minibatch is the entire source of negatives for a given pair. A small batch gives the model only a handful of negatives to discriminate against, which is an easy task that supplies weak gradient signal; a large batch supplies many more negatives per step, making the task genuinely harder and giving a closer approximation to discriminating against the full space of possible mismatches, which is why CLIP used very large batch sizes. Batch size directly determines negative count here, it is not merely a GPU-parallelism detail, there is no separate memory bank, and the paper does not report large batches as hurting accuracy -- the opposite is true."

- type: mcq
  question: "A traditional image classifier has a fixed-size final classification layer, with one output unit per class baked in at training time. How does CLIP's zero-shot setup avoid this constraint, enabling what is often called 'open-vocabulary' recognition?"
  choices:
    - "A fixed-head classifier and CLIP's zero-shot approach are architecturally identical, differing only in which loss function was used at training time, with both requiring the exact same retraining procedure to add a new class after deployment"
    - "Open-vocabulary recognition refers exclusively to CLIP's ability to accept input images at any pixel resolution, unrelated to how class labels or categories are represented or produced at inference time"
    - "A traditional fixed-head classifier bakes a specific, closed set of classes into the weights of its final classification layer, so recognizing a new category requires retraining or replacing that layer; CLIP's zero-shot setup has no such fixed head at all -- its 'classifier' is synthesized at inference time from the text embeddings of whatever class names or prompts are supplied, so new categories can be recognized just by specifying their name in natural language, without retraining anything"
    - "Open-vocabulary recognition means CLIP precomputes and stores a large fixed dictionary of text embeddings for every common English word during pretraining, so that at inference time a new class name is simply looked up in this precomputed dictionary rather than being freshly encoded by the text encoder each time; class names outside that precomputed set fall back to whichever existing dictionary entry happens to be the closest match by spelling, and the text encoder itself is only ever invoked once, during the original precomputation step"
  answer_index: 2
  explanation: "A fixed-head classifier's final layer has one learned weight vector per class, so its set of recognizable categories is closed at training time and adding a class means retraining that layer. CLIP has no such layer: at inference, the 'classifier' for a given task is assembled on the fly from the text embeddings of whatever class names are supplied as prompts, so recognizing a new category is just a matter of writing its name in text, with no weights retrained. This is unrelated to input image resolution, it is not architecturally identical to a fixed-head classifier, and there is no fixed precomputed dictionary limiting which words can be used as class names."

- type: short
  question: "Instead of a smaller, expensively human-curated and labeled dataset like ImageNet, CLIP was pretrained on a much larger set of image-text pairs collected automatically from the web (an image plus its surrounding alt-text or caption), with no manual label curation. Describe the tradeoff this represents, and why CLIP's scale can compensate for the resulting per-example noise."
  answer_keywords:
    - "web collected captions are far cheaper and more abundant"
    - "individual pairs can be mismatched or low quality since there is no manual curation step"
    - "contrastive pretraining over hundreds of millions of pairs can average out per example noise"
  model_answer: "Curated datasets like ImageNet are accurate at the level of an individual example, since a human verified each label, but that curation is expensive and limits scale to a comparatively small, fixed vocabulary of classes. CLIP instead uses image-text pairs scraped automatically from the web, where web collected captions are far cheaper and more abundant, which is what let CLIP reach a dataset of roughly four hundred million pairs. The cost is that individual pairs can be mismatched or low quality since there is no manual curation step -- alt text is sometimes irrelevant, vague, or simply wrong about what the image shows. What makes this an acceptable tradeoff is scale: contrastive pretraining over hundreds of millions of pairs can average out per example noise, because any one mislabeled or badly captioned pair contributes only a small fraction of the total gradient signal, whereas a small curated dataset has no such averaging effect and each label error carries proportionally far more weight."
  explanation: "Curated, human-labeled datasets are accurate per example but expensive to build, which caps their achievable scale and the vocabulary of concepts they can cover. Web-collected image-text pairs flip that tradeoff: web collected captions are far cheaper and more abundant, letting CLIP train on roughly 400 million pairs, but individual pairs can be mismatched or low quality since there is no manual curation step verifying that a given caption actually describes its paired image. The reason this works out favorably is that contrastive pretraining over hundreds of millions of pairs can average out per example noise -- any single bad pair only nudges the gradient slightly amid a huge batch of mostly-good pairs, so scale substitutes for per-example cleanliness in a way a small curated dataset cannot replicate."

- type: short
  question: "Beyond zero-shot classification, CLIP's learned image and text embeddings are reused as a building block in several other systems. Name at least two downstream uses of CLIP embeddings, and briefly describe how each one relies on the embedding space CLIP learned."
  answer_keywords:
    - "dall-e 2 and stable diffusion use clip embeddings to condition image generation on the input text prompt"
    - "clip embeddings support text to image and image to image retrieval by comparing embeddings with cosine similarity"
    - "clip's image encoder is reused as a general purpose frozen visual feature extractor for other downstream vision tasks"
  model_answer: "CLIP embeddings are reused well beyond zero-shot classification. Image generation models like DALL-E 2 and Stable Diffusion use CLIP embeddings to condition image generation on the input text prompt, mapping a text description into CLIP's joint embedding space and using that embedding to steer what image gets generated, so the generated image ends up semantically aligned with the prompt the way CLIP's own image-text pairs are aligned. Retrieval systems reuse the same idea in the other direction: clip embeddings support text to image and image to image retrieval by comparing embeddings with cosine similarity, since anything CLIP maps close together in its shared embedding space is, by construction, semantically related, so retrieving the nearest embeddings to a query returns semantically matching results. Finally, clip's image encoder is reused as a general purpose frozen visual feature extractor for other downstream vision tasks, feeding CLIP's frozen image embeddings into new task-specific heads or systems without retraining the encoder itself, since pretraining already produced broadly useful visual features."
  explanation: "CLIP's joint embedding space turns out to be useful well past its original zero-shot classification setting. Image generation models like DALL-E 2 and Stable Diffusion use CLIP embeddings to condition image generation on the input text prompt, using the text embedding (directly or through an intermediate prior) to steer the generative process toward images that are semantically aligned with the prompt. Retrieval systems exploit the same joint space differently: clip embeddings support text to image and image to image retrieval by comparing embeddings with cosine similarity, since semantically related content ends up nearby in the embedding space regardless of modality. And more generally, clip's image encoder is reused as a general purpose frozen visual feature extractor for other downstream vision tasks, since its pretraining on hundreds of millions of diverse image-text pairs produces visual features that transfer well without further training."

- type: mcq
  question: "CLIP is known to have several practical failure modes despite its strong zero-shot performance. What are they, and why do they arise?"
  choices:
    - "CLIP has no known accuracy weaknesses relative to supervised classifiers on any task; the only reported limitation in the literature is slower inference latency compared to a fixed-head ResNet classifier"
    - "CLIP is vulnerable to typographic attacks, where placing a handwritten or printed label (e.g. a piece of paper reading 'iPod') directly on an object causes the model to classify based on the visible text rather than the object's actual visual appearance, since CLIP's joint embedding space was trained on image-caption pairs where visible text in a photo often correlates strongly with the described content; CLIP also inherits biases present in its web-scraped training data and tends to underperform on fine-grained classification, counting objects, and spatial reasoning -- tasks that require more structured discrimination than broad image-caption matching typically provides"
    - "Typographic attacks refer to CLIP's inability to process any image containing text of any kind, causing the model to output a null prediction whenever so much as a single character appears anywhere in an input image, regardless of content"
    - "CLIP's fine-grained classification and counting weaknesses were entirely eliminated by the choice of a ViT rather than a ResNet image encoder, so any modern CLIP checkpoint using a ViT backbone exhibits none of these limitations while ResNet-backbone checkpoints exhibit all of them"
  answer_index: 1
  explanation: "CLIP's documented weaknesses include typographic attacks -- text physically placed on an object can override the model's visual judgment, because visible text co-occurring with matching captions was a common pattern in its web-scraped training data -- along with inherited biases from that same training data, and weaker performance on tasks needing more structured discrimination than broad caption-matching provides, such as fine-grained classification, counting, and spatial reasoning. CLIP does have real accuracy weaknesses (not just latency), typographic attacks do not simply block CLIP from processing any text-containing image outright, and switching to a ViT backbone does not eliminate these known limitations."

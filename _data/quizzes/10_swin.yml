# _data/quizzes/10_swin.yml
- type: mcq
  question: "Standard global multi-head self-attention (MSA) computes an attention score between every pair of tokens, giving it O(N^2) complexity in the number of tokens N. For high-resolution dense-prediction tasks like object detection or semantic segmentation, why is this quadratic scaling especially prohibitive compared to image classification?"
  choices:
    - "Global MSA's O(N^2) cost only manifests on GPUs with limited on-chip SRAM capacity, so it is prohibitive for dense prediction purely as a hardware limitation of certain accelerators, with no real relationship to token count, image resolution, or the task itself"
    - "Dense-prediction tasks are prohibitive because global MSA cannot represent spatial relationships between distant patches at all, an architectural limitation unrelated to compute cost, so no amount of additional compute budget, model parallelism, or specialized accelerator hardware could ever make global attention usable for detection or segmentation, regardless of image size, batch size, or how the workload is distributed across devices, since the limitation is supposedly inherent to the attention operation's mathematical formulation itself and not to any resource constraint whatsoever"
    - "Dense-prediction tasks like detection and segmentation need feature maps with far more tokens than a classification backbone typically operates at, since preserving fine spatial detail requires little or no downsampling; because attention cost grows with N^2, that much larger N makes global attention's compute and memory blow up far faster than the token count itself grows, whereas a classification backbone can aggressively downsample to a small, fixed token count"
    - "Classification also requires exactly the same high token counts as detection and segmentation once a backbone is pretrained at large scale, so global MSA's quadratic cost is equally prohibitive for both settings; there is no meaningful practical difference between the two"
  answer_index: 2
  explanation: "A classification backbone typically pools or downsamples down to a modest, fixed token count before the final prediction, so global MSA's quadratic cost stays manageable. Dense-prediction tasks need to preserve much finer spatial detail across the whole feature map, which means operating on far more tokens N; since attention cost scales as N^2, that larger token count makes global attention's compute and memory requirements grow far faster than the token count itself, quickly becoming impractical at typical detection/segmentation resolutions. This is a genuine compute/memory scaling problem tied directly to token count and resolution, not a GPU-SRAM-specific hardware quirk, not a fundamental inability to represent distant relationships, and classification does not require anywhere near the same token counts as dense prediction in practice."

- type: mcq
  question: "Window-based multi-head self-attention (W-MSA) restricts attention to fixed, non-overlapping local windows, which gives Swin its linear-cost efficiency. If every Swin block used only W-MSA with the exact same fixed window partition at every layer, what capability would the network lack, and how does alternating with shifted-window MSA (SW-MSA) address it?"
  choices:
    - "Only using W-MSA would make training numerically unstable because windowed attention lacks any residual connection around it, and SW-MSA's role is solely to reintroduce a residual path into the block rather than to change which tokens are able to attend to each other"
    - "Using only fixed, identically-placed windows at every layer means tokens in one window can never attend to tokens in a neighboring window, at any depth, so the network would have no way to model relationships that cross a window boundary; alternating with SW-MSA, which displaces the window grid before partitioning, introduces new window boundaries that bridge across the previous layer's boundaries, letting information gradually flow between originally separate windows across successive blocks"
    - "W-MSA windows are already overlapping by design, so alternating with SW-MSA is unnecessary for cross-window information flow, and SW-MSA instead exists only to reduce how many parameters the relative position bias table needs to store at each of the four stages, a purely parameter-efficiency motivation with no connection whatsoever to which tokens can attend to which other tokens, and one that would apply identically even if window boundaries never moved even once at all across the entire depth of the whole network from the first block to the last"
    - "Fixed W-MSA windows already let every token attend to every other token in the whole image through indirect stacking of many layers alone, so SW-MSA is used purely to accelerate convergence speed rather than to enable any interaction that W-MSA could not already provide given enough depth"
  answer_index: 1
  explanation: "Fixed, unshifted W-MSA windows partition the feature map the same way at every layer, so a token near the edge of one window can never exchange information with a token in an adjacent window no matter how many such layers are stacked -- the boundary never moves. SW-MSA fixes this by displacing the window grid before the next partition, so window boundaries fall in different places than they did in the preceding W-MSA layer; over a W/SW pair, patches that were split apart by one partition end up sharing a window under the other, letting information gradually propagate across the whole feature map. This is not about residual connections (which are present regardless), W-MSA's windows are non-overlapping by design rather than overlapping, and stacking unshifted W-MSA layers alone would never let distant tokens interact."

- type: mcq
  question: "SW-MSA needs to partition a shifted feature map into windows again before computing attention. Naively re-partitioning after the shift produces some windows smaller than M×M along the image border, and more total windows than the unshifted partition had. What problem does this create for efficient batched computation, and what does the cyclic-shift trick (`torch.roll`) do instead?"
  choices:
    - "Irregular windows are actually preferred for accuracy, so the cyclic-shift trick exists only to make Swin's implementation compatible with older GPU kernels that require power-of-two tensor shapes, with no real effect on window size uniformity"
    - "The problem is that naive re-windowing duplicates every patch into two overlapping windows simultaneously, and cyclic shift solves this by deleting one of the two duplicate copies at random before attention is computed"
    - "Naive re-windowing after a shift actually produces windows that are all larger than M×M rather than smaller, and cyclic shift solves this by cropping every resulting window down to a fixed smaller size, discarding whatever border tokens do not fit"
    - "Variable-sized windows can't be batched into one regular tensor the way uniform M×M windows can, and padding the smaller border windows up to full size wastes compute on padding tokens; cyclic-shift instead rolls the feature map so content pushed off one edge wraps around to the opposite edge, keeping every resulting window exactly M×M and the same total window count as the unshifted partition, so shifted attention can reuse the same efficient batched-window computation"
  answer_index: 3
  explanation: "Efficient batched attention wants every window to be the exact same M×M shape so windows can be stacked into one regular tensor; naive re-partitioning after a shift breaks this by producing extra, smaller windows along the border, and padding those up to full size wastes compute on padding tokens. `torch.roll` sidesteps the problem entirely: it cyclically shifts the whole feature map so that content pushed off one edge reappears on the opposite edge, which keeps the total window count and every window's shape identical to the unshifted case. No padding, duplication, or cropping is involved, and the resulting windows are not larger than M×M -- they stay exactly M×M throughout."

- type: short
  question: "After the cyclic shift, some windows contain patches that were spatially non-adjacent before the shift (e.g. content wrapped around from the opposite edge of the image next to content that was already there). Explain how Swin's attention mask keeps SW-MSA from letting these wrapped-together, non-adjacent regions attend to each other."
  answer_keywords:
    - "labeled by which region it came from before the shift"
    - "large negative value before the softmax is applied"
    - "attention weight for cross region pairs to effectively zero"
  model_answer: "Each cyclically shifted window can contain sub-blocks pulled from different, non-adjacent regions of the original unshifted feature map. Swin handles this by giving every patch a region id, labeled by which region it came from before the shift, based on which of the pre-shift regions it belongs to. When computing attention inside a shifted window, an additive mask adds a large negative value before the softmax is applied to the raw attention scores between any query-key pair whose region ids differ, while pairs sharing the same region id are left unmasked at zero. After softmax, this pushes the attention weight for cross region pairs to effectively zero, so within a single shifted window, only patches that were actually spatially adjacent before the shift can meaningfully attend to each other, even though they are packed into the same window."
  explanation: "A shifted window can pack together sub-blocks from what were originally separate, non-adjacent regions of the feature map, since content wraps around from the opposite edge. Swin assigns each patch a region id based on its pre-shift location, then adds a large negative bias to the raw attention score of any query-key pair whose region ids differ, leaving same-region pairs untouched, before the softmax is computed. Because softmax turns large negative scores into values very close to zero, cross-region attention weight collapses to effectively zero after normalization, so attention inside a shifted window behaves as if it were computed separately per original region, even though the regions physically share one window tensor."

- type: mcq
  question: "Swin adds a learned relative position bias to attention scores within each window rather than adding absolute position embeddings to token features, the way ViT does. Why is a relative bias, defined per-window, a better fit for Swin's architecture than absolute position embeddings would be?"
  choices:
    - "Absolute position embeddings cannot mathematically be added to windowed attention scores at all, since windowed attention operates on a different tensor rank than global attention does, making relative bias the only option that is even dimensionally valid"
    - "Windows recur with the exact same M×M shape at many different absolute locations across the feature map and across stages, so what matters for attention inside a window is each patch's position relative to the others in that window, not its absolute coordinate in the whole image; a small relative position bias table indexed by relative offset, bounded by window size, can be shared identically across every window instance, while absolute embeddings tied to fixed image coordinates would need separate values, or re-indexing, for every possible window location and every stage's resolution"
    - "Relative position bias is used because it removes the need for the shifted-window mechanism entirely, letting a single fixed window partition achieve the same cross-window connectivity that SW-MSA would otherwise require"
    - "Absolute embeddings would work equally well within Swin's architecture at any stage or resolution, but relative bias was chosen purely because it happens to use zero learnable parameters and requires no training whatsoever, unlike absolute embeddings, which require training a full per-position embedding table for every possible patch location in every single stage of the network, at every window size, and at every input resolution the model might ever conceivably be fine-tuned or evaluated at over its entire training run and its whole subsequent deployment lifetime across all downstream tasks"
  answer_index: 1
  explanation: "The same M×M window shape is reused at every location across the feature map and at every stage's resolution, so a bias indexed by relative offset within a window -- rather than by absolute image coordinate -- can be shared identically across every window instance, since the geometry inside any window looks the same regardless of where that window sits. Absolute embeddings, by contrast, are tied to fixed coordinates and would need distinct values (or awkward re-indexing) for every window location and every stage's resolution. This has nothing to do with tensor-rank compatibility, does not eliminate the need for SW-MSA's cross-window connectivity, and relative bias is not chosen merely for having fewer parameters -- it is a learned table with real parameters, just a much smaller and more reusable one."

- type: mcq
  question: "At the start of each new stage after the first, Swin applies a patch merging layer that concatenates each 2×2 group of neighboring patches along the channel dimension and then linearly projects the result. What effect does this have on the feature map, and why does repeating it across stages give Swin a hierarchical, CNN-pyramid-like representation?"
  choices:
    - "Patch merging doubles the number of spatial tokens at every stage while halving the channel dimension, gradually converging toward a per-pixel-resolution feature map by the final stage -- the opposite of what a CNN feature pyramid does"
    - "Patch merging has no effect on either spatial resolution or channel width; its only real purpose is to reset the relative position bias table between stages so that later stages do not inherit bias values learned by an earlier stage"
    - "Concatenating each 2x2 neighborhood quarters the number of spatial tokens, halving height and width, while the following linear projection expands the channel dimension, typically to twice the input width; repeating this at each stage boundary produces a sequence of feature maps at progressively coarser spatial resolution and progressively greater channel depth, mirroring how a CNN's pooling and strided layers build a multi-scale feature pyramid, which is what lets Swin's multi-resolution outputs plug directly into detection and segmentation frameworks built around such pyramids"
    - "Patch merging concatenates every patch across the entire feature map into a single token regardless of stage, collapsing the whole image down to one vector after just the first merging layer, which is what gives Swin its linear-time complexity"
  answer_index: 2
  explanation: "Grouping each 2x2 neighborhood of patches and concatenating along channels reduces the spatial token count to a quarter of what it was (halving both height and width), and the linear projection that follows expands the channel dimension, typically doubling it. Doing this at the boundary of each of Swin's four stages produces a sequence of feature maps that get spatially coarser and channel-wise deeper stage by stage, which is structurally analogous to how a CNN's pooling or strided-convolution layers build a multi-scale feature pyramid -- and it is precisely this multi-resolution output that lets Swin serve as a drop-in backbone for pyramid-based detection and segmentation frameworks. It does not increase token count or shrink channels, it has nothing to do with resetting the position bias table, and it never collapses the whole feature map to a single token."

- type: mcq
  question: "Global MSA over h×w patches costs O((hw)^2), since every patch attends to every other patch. Windowed MSA with fixed M×M windows instead costs O(hw·M^2). Given that M is a small constant window size while h and w grow with image resolution, why does this make W-MSA's cost scale linearly in patch count while global MSA's scales quadratically?"
  choices:
    - "Both formulas actually scale identically once M is treated as a variable, since M itself grows proportionally with h and w in practice, making the distinction between the two formulas purely notational rather than a real difference in scaling behavior"
    - "W-MSA is linear because it computes attention for only a single representative patch per window rather than for all of the patches within that window, while global MSA computes attention across every patch in the entire image simultaneously"
    - "In O(hw*M^2), M is a fixed constant that does not grow as image resolution increases, so the cost is directly proportional to hw, the total patch count -- doubling the number of patches roughly doubles the cost, i.e. linear scaling; in O((hw)^2), the patch count hw is itself squared, so doubling the number of patches roughly quadruples the cost, since every one of the hw patches must attend to all hw other patches rather than only to a fixed-size local window"
    - "The exponent difference comes entirely from global MSA using several attention heads while W-MSA uses only a single head per window, and has nothing to do with how many patches fall within each formula's attention span"
  answer_index: 2
  explanation: "M is fixed at a small constant (e.g. 7) regardless of image resolution, so in O(hw*M^2) the only quantity that grows with resolution is hw itself, making cost directly proportional to patch count -- linear scaling. In O((hw)^2), the patch count hw appears squared, so cost grows with the square of patch count -- quadratic scaling. This gap has nothing to do with head count (both formulas are agnostic to how many heads are used), and W-MSA does compute attention among all M^2 patches inside each window, not just one representative patch; M genuinely stays constant rather than growing with hw, so the two formulas are not secretly equivalent."

- type: short
  question: "Describe the internal layer structure of a single Swin Transformer block, and explain how it parallels the structure of a standard (e.g. ViT) transformer encoder block."
  answer_keywords:
    - "layer norm before the attention sublayer and before the mlp sublayer"
    - "residual connection around the attention output"
    - "replaces standard global multi head self attention with windowed attention"
  model_answer: "A Swin Transformer block follows a pre-norm design with layer norm before the attention sublayer and before the mlp sublayer, exactly like a standard ViT encoder block: LayerNorm, then the attention sublayer, then a residual connection around the attention output, then a second LayerNorm, then a two-layer MLP with a GELU activation, then a second residual connection around the MLP output. The key structural difference is that a Swin block replaces standard global multi head self attention with windowed attention, using W-MSA in one block and SW-MSA in the very next block, so blocks are always applied in W/SW pairs; aside from swapping in windowed attention for global attention, the surrounding LayerNorm-residual-MLP-residual skeleton is identical to a standard transformer encoder block."
  explanation: "Structurally, a Swin block is a standard pre-norm transformer encoder block: LayerNorm, an attention sublayer, a residual connection, a second LayerNorm, an MLP sublayer, and a second residual connection, in that order -- the same skeleton ViT uses. The one substantive change is which attention operation sits in the attention sublayer: Swin alternates W-MSA and SW-MSA across consecutive blocks instead of using global MSA in every block, so blocks are always applied in W/SW pairs. Everything else about the block's layout, normalization placement, and residual wiring is carried over unchanged from the standard transformer encoder block design."

- type: short
  question: "Object detection frameworks like Mask R-CNN and segmentation frameworks like UperNet are typically designed around a feature pyramid: multiple feature maps at different resolutions and channel widths. Explain why Swin's architecture supplies this naturally, while a plain ViT backbone does not."
  answer_keywords:
    - "produces feature maps at multiple resolutions and channel widths as a byproduct of its stages"
    - "single fixed resolution sequence of patch tokens throughout"
    - "expects multi scale features that must be manufactured separately"
  model_answer: "Swin's four-stage design with patch merging between stages produces feature maps at multiple resolutions and channel widths as a byproduct of its stages, halving spatial resolution and doubling channel depth at each stage boundary, which is exactly the multi-scale feature pyramid that frameworks like Mask R-CNN's FPN and UperNet expect a backbone to supply. Plain ViT, in contrast, keeps a single fixed resolution sequence of patch tokens throughout every layer, with no built-in mechanism for progressively downsampling or widening the representation. So when plain ViT is used as a backbone for one of these frameworks, the framework expects multi scale features that must be manufactured separately, for example by extracting intermediate layers and manually resampling them to different resolutions, rather than Swin's natural hierarchy already providing the pyramid directly."
  explanation: "Mask R-CNN's feature pyramid network and UperNet are both built around consuming several feature maps at different resolutions and channel widths at once. Swin's stage structure, with patch merging halving resolution and doubling channels between stages, produces exactly that multi-scale set of feature maps as a natural byproduct of its forward pass. Plain ViT keeps every layer's output at the same fixed token count and channel width from start to finish, so it has no built-in multi-scale structure; using it as a backbone for these frameworks requires extra engineering to manufacture a pyramid, such as resampling intermediate layers to different resolutions, rather than getting one for free the way Swin does."

- type: mcq
  question: "Comparing Swin, plain ViT, and ResNets on tasks like ImageNet-1K classification, COCO detection, and ADE20K segmentation, what general pattern of tradeoffs emerges across accuracy, compute cost, and inductive bias among the three?"
  choices:
    - "ResNets always outperform both Swin and plain ViT on every one of these benchmarks regardless of scale, so the only real tradeoff being reported across the three architectures is compute cost, with accuracy uniformly favoring convolutional architectures on classification, detection, and segmentation alike, and with inductive bias playing no measurable role whatsoever in explaining any of the reported accuracy differences between the three families of models at any model size, dataset size, or pretraining regime"
    - "Plain ViT has the strongest inductive bias of the three architectures because self-attention is inherently local by construction, while Swin and ResNets are both described as relying entirely on global operations with no locality assumption built in anywhere"
    - "ResNets carry the strongest built-in inductive bias and are cheap and hierarchical by construction but tend to plateau in accuracy at large scale; plain ViT has the weakest built-in bias and the costliest global attention, needing large-scale pretraining and lacking a native multi-scale pyramid; Swin sits between the two, reintroducing some CNN-like structural bias while keeping attention's flexibility, letting it match or beat both on classification and outperform plain ViT as a dense-prediction backbone"
    - "Swin and plain ViT are described as architecturally and empirically identical across every one of these benchmarks; the only reported difference between the two is training wall-clock time, not final accuracy or inductive bias"
  answer_index: 2
  explanation: "The general pattern reported across these comparisons is a three-way tradeoff: ResNets have the strongest built-in locality/translation-equivariance bias and are cheap and naturally hierarchical, but their accuracy tends to plateau relative to attention-based models given enough scale; plain ViT has the weakest built-in bias and the costliest global attention, so it typically needs large-scale pretraining data to be competitive, and its single-resolution output is a poor native fit for dense-prediction pyramids; Swin sits in between, reintroducing locality (via windows) and hierarchy (via patch merging) while retaining attention's flexibility, which is why it tends to match or beat both alternatives on classification and clearly outperforms plain ViT as a detection/segmentation backbone at comparable compute. ResNets do not universally win every benchmark, self-attention is not inherently local (that is precisely why windowing was introduced), and Swin and ViT are not empirically or architecturally interchangeable."

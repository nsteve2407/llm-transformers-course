# _data/quizzes/06_scaling_modern_llms.yml
- type: mcq
  question: "Kaplan et al. showed that pretraining loss follows a smooth power-law in model size, dataset size, and compute, largely independent of architectural details like depth vs. width. What does this power-law relationship imply about the 'sample efficiency' of larger models?"
  choices:
    - "Sample efficiency is unrelated to model size; the power law only describes how loss decreases with total compute, regardless of how that compute is split between model size and data"
    - "Larger models require proportionally more training tokens per parameter to reach the same loss as a smaller model, making them less sample-efficient"
    - "Larger models reach a given loss value after seeing fewer training tokens than smaller models — they extract more signal per token, so scaling up model size is a more sample-efficient way to reduce loss than training a small model for longer on the same data"
    - "The power law only holds when depth is increased, not width, so sample efficiency depends entirely on architectural depth choices rather than parameter count"
  answer_index: 2
  explanation: "One of Kaplan et al.'s central findings is that larger models are more sample-efficient: for a fixed number of training tokens, a bigger model reaches lower loss, and equivalently, a bigger model needs to see fewer tokens to reach any given loss value than a smaller model does. This is part of why the Kaplan-era prescription favored scaling model size aggressively even without a proportional increase in data — bigger models were getting more out of each token seen. The power law describes loss as a smooth function of model size, dataset size, and compute each considered individually (as well as jointly), and it holds across a wide range of depth/width configurations at fixed parameter count, so sample efficiency is very much tied to total parameter count, not to depth specifically."

- type: mcq
  question: "The Chinchilla paper revisited Kaplan et al.'s scaling analysis and arrived at a different prescription for how to split a fixed compute budget between model size (N) and training tokens (D). What did Chinchilla conclude, and what methodological issue in the earlier analysis does it point to as a likely explanation for the discrepancy?"
  choices:
    - "Chinchilla concluded that dataset size should stay roughly fixed regardless of compute budget, and all additional compute should go toward increasing model size instead"
    - "Chinchilla found that N and D should be scaled in roughly equal proportion as compute grows, implying Kaplan-era models were too large relative to the amount of data they were trained on; it points to Kaplan et al.'s use of a learning-rate schedule tuned for a fixed step budget as a likely source of bias, since loss measured before the schedule had fully decayed at large token counts could distort the fitted optimal N/D ratio toward oversized models"
    - "Chinchilla found the exact same N/D allocation as Kaplan et al., but showed it could be reached with a much smaller total compute budget than previously thought"
    - "Chinchilla concluded that model size stops affecting final loss once dataset size passes a fixed threshold, so all compute should be spent on data alone, with model size held constant"
  answer_index: 1
  explanation: "Chinchilla's compute-optimal experiments found that, contrary to Kaplan et al.'s prescription of scaling model size much faster than data as compute grows, N and D should be scaled at roughly the same rate — meaning many Kaplan/GPT-3-era models were considerably larger than optimal for the amount of data they saw. Chinchilla's authors suggest one likely cause of the earlier, different conclusion: Kaplan et al.'s training runs used a learning-rate schedule length tied to a fixed step budget, so for runs evaluated at intermediate token counts the schedule hadn't finished decaying, and loss measured under an undecayed schedule can look worse than it would after full decay — this can skew a fitted optimal-allocation curve. The other options either reverse the actual relationship (fixing D and scaling only N) or invent conclusions Chinchilla didn't reach (an identical allocation, or data mattering only past a threshold)."

- type: short
  question: "Given a fixed compute budget, Chinchilla-style compute-optimal training implies a specific balance between model size and training tokens. In what sense were GPT-3-scale models 'undertrained' relative to this balance, and what does LLaMA's approach to choosing its training token counts suggest it is optimizing for, beyond pure training-compute-optimality?"
  answer_keywords:
    - "too many parameters and too few training tokens"
    - "smaller model trained longer"
    - "cheaper and faster to serve"
    - "compute optimal allocation"
  model_answer: "GPT-3-scale models were undertrained in the compute-optimal sense: for the amount of compute spent training them, they had too many parameters and too few training tokens — a compute-optimal model trained with that same compute budget would have been smaller and trained on substantially more data to reach a lower loss for the same cost. LLaMA's choice of training token counts goes further in the opposite direction: it deliberately trains a smaller model on far more tokens than the compute optimal allocation for training FLOPs alone would recommend, because once you account for inference cost, a smaller model trained longer can match a larger compute-optimal model's quality while being cheaper and faster to serve at scale — LLaMA is optimizing for total cost including inference, not training compute alone."
  explanation: "Compute-optimality (as Chinchilla defines it) only asks: for this training compute budget, what N/D split minimizes training loss? GPT-3-scale models sat well above the compute-optimal model size for the data they were trained on — they were 'undertrained' relative to their own parameter count, meaning a same-size or even smaller model trained on more tokens would have reached lower loss for the same training compute. LLaMA pushes this further and deliberately trains smaller models on token counts well beyond what training-compute-optimality alone would prescribe, because a model that will be deployed and queried repeatedly incurs a real, recurring inference cost that scales with parameter count; a smaller, longer-trained model can match a larger compute-optimal model's quality while being substantially cheaper to run in production. This reflects a shift from optimizing training compute alone to optimizing total (training + inference) cost."

- type: mcq
  question: "Rotary Position Embedding (RoPE) encodes position by rotating pairs of query and key vector components by a position-dependent angle, rather than adding a separate positional vector to the token embedding. What property does this give the attention dot product between a query at position m and a key at position n, and how does this affect behavior on sequences longer than any seen during training?"
  choices:
    - "Rotating each vector by its own position-dependent angle before the dot product makes Q_m·K_n depend only on the relative offset (m − n) and the content of Q and K, not on the absolute positions m and n themselves; this relative-position property lets RoPE generalize somewhat more gracefully to sequence lengths beyond training than a learned absolute positional embedding table, though extrapolation quality still degrades and is often improved further with dedicated scaling or interpolation techniques"
    - "RoPE concatenates a fixed sinusoidal vector to each token embedding before the first layer, exactly like the original Transformer's positional encoding, so it has no effect on the attention dot product itself"
    - "RoPE replaces the softmax normalization in attention with a rotation-based operation, removing the need for any positional information at all"
    - "RoPE's rotation angle depends only on the embedding dimension index, not on token position, so every token at every position receives an identical rotation and no positional information is encoded"
  answer_index: 0
  explanation: "RoPE applies a position-dependent rotation matrix to pairs of components within the query and key vectors, with the rotation angle at each pair growing with both the token's position and a frequency associated with that pair (mirroring the multi-frequency structure of sinusoidal encodings). Because a rotation applied to both Q and K before their dot product is taken, the algebra works out so that Q_m·K_n depends only on the relative offset m − n, not on m and n individually — this is RoPE's key relative-position property, baked directly into attention rather than added as a separate input feature. This makes RoPE somewhat better-behaved than a learned absolute positional embedding table when evaluated beyond the trained context length (a lookup table simply has no entry past its maximum trained index), though naive RoPE extrapolation still degrades in practice, which is why techniques like position interpolation and NTK-aware scaling exist as further fixes. It is not a replacement for softmax, and the rotation angle depends on position, not just dimension index."

- type: short
  question: "RMSNorm is used in place of LayerNorm in LLaMA and many other modern LLMs. LayerNorm normalizes a vector by subtracting its mean and dividing by its standard deviation, then applies a learned scale and shift. What does RMSNorm do differently, and what's the practical benefit?"
  answer_keywords:
    - "drops the re-centering step"
    - "never computes or subtracts the mean"
    - "root mean square"
    - "cheaper to compute"
  model_answer: "RMSNorm drops the re-centering step that LayerNorm performs — it never computes or subtracts the mean of the vector — and instead normalizes purely by the root mean square of the vector's values, then applies a learned per-element scale (RMSNorm typically omits LayerNorm's learned shift term too). Because it skips computing the mean, RMSNorm needs fewer statistics and fewer operations per normalization than LayerNorm, making it cheaper to compute, while performing comparably to LayerNorm in practice for Transformer language models."
  explanation: "LayerNorm computes two statistics per vector — the mean (for re-centering) and the standard deviation (for re-scaling) — before applying a learned affine transform. RMSNorm's authors observed that the re-centering (mean-subtraction) step contributes little to LayerNorm's benefit, and dropping it lets RMSNorm normalize using only the root-mean-square statistic, skipping the mean computation and the subtraction step entirely. Fewer statistics and fewer elementwise operations per normalization translate into real, measurable compute and memory-traffic savings when applied at every layer of a large model over long sequences, which is why RMSNorm is now the default choice in LLaMA-family and many other modern LLMs, at negligible cost to model quality."

- type: mcq
  question: "LLaMA's feed-forward block uses SwiGLU instead of the original Transformer's ReLU MLP. SwiGLU's gating mechanism uses three weight matrices (two 'up'-style projections plus one 'down' projection) rather than the two a standard ReLU MLP uses, so a naive hidden dimension of the same width as a standard MLP's would increase the block's total parameter count. What does LLaMA do to compensate, and why adopt SwiGLU despite the added structure?"
  choices:
    - "LLaMA keeps the SwiGLU hidden dimension identical to a standard ReLU MLP's hidden dimension and simply accepts the resulting larger parameter count, since it never tries to match parameter budgets across feed-forward variants"
    - "LLaMA removes the down-projection matrix entirely, so SwiGLU ends up with only two weight matrices total, the same as a standard ReLU MLP"
    - "SwiGLU is used only in the very first feed-forward layer of the network, with every other layer reverting to a standard ReLU MLP, specifically to avoid any parameter count increase"
    - "LLaMA shrinks the SwiGLU hidden dimension below what a same-width ReLU MLP would use, so the extra weight matrix doesn't inflate the block's total parameter count relative to a standard MLP of similar overall size; it adopts SwiGLU because gated activations of this form empirically improve language modeling quality at matched parameter count, per the GLU-variants literature"
  answer_index: 3
  explanation: "A standard ReLU MLP has two weight matrices (up-projection to d_ff, down-projection back to d_model). SwiGLU's gating mechanism needs two separate up-style projections (one gated through a SiLU/Swish nonlinearity, one left linear, then multiplied elementwise) plus a down-projection — three matrices in total. To keep the feed-forward block's parameter count comparable to a same-d_model standard MLP rather than letting it balloon, LLaMA scales down the SwiGLU hidden dimension relative to what an equivalent-capacity ReLU MLP would use, so the total parameter count across the three matrices lands close to what two matrices at the naive width would have cost. The motivation for adopting SwiGLU at all, despite this extra bookkeeping, is empirical: gated linear unit variants of the feed-forward block were found to improve downstream language modeling quality at matched parameter count and compute compared to a plain ReLU or GELU MLP. Keeping the naive width (inflating parameters), dropping the down-projection (which would break the gating mechanism), or restricting SwiGLU to one layer are not what LLaMA does."

- type: mcq
  question: "Multi-head attention (MHA), multi-query attention (MQA), and grouped-query attention (GQA) differ in how key/value projections are shared across attention heads during autoregressive generation. Which statement correctly describes what's shared in each, and the resulting KV-cache trade-off?"
  choices:
    - "MHA shares a single key/value head across all query heads, while MQA and GQA both give every query head its own independent key/value projections, making MHA the cheapest of the three in KV-cache size"
    - "MHA gives every query head its own key and value projections, with no sharing at all; MQA takes this to the opposite extreme, sharing one single key/value head across every query head; GQA sits in between, partitioning query heads into groups that each share one key/value head — moving from MHA toward MQA/GQA shrinks the KV cache stored during autoregressive decoding, since fewer distinct key/value projections need to be cached and read back per step, trading some model quality for lower memory traffic and faster inference"
    - "GQA and MQA both increase the KV cache size relative to MHA, since they add extra key/value heads on top of the ones MHA already computes"
    - "The distinction between MHA, MQA, and GQA is purely about the query projections; key and value projections are always fully independent per head in all three variants, so none of them affects KV-cache size"
  answer_index: 1
  explanation: "In MHA, every attention head has its own independently-learned key and value projection, so the KV cache used during autoregressive generation must store a separate key and value vector per head, per cached token. MQA collapses this to a single shared key/value head used by every query head, drastically shrinking the cache (and the memory bandwidth needed to read it back at each generation step) at some cost to representational capacity and model quality. GQA is a middle ground: query heads are split into a small number of groups, and each group shares one key/value head, recovering much of MHA's quality while still cutting the KV cache substantially compared to full MHA. This matters because at long context lengths and large batch sizes, KV-cache memory traffic — not raw compute — is often the inference bottleneck, which is why GQA is widely adopted in larger modern LLMs. The other options invert which variant shares what, or incorrectly claim KV-cache size is unaffected."

- type: short
  question: "Describe the core iterative algorithm behind Byte-Pair Encoding (BPE) tokenization: starting from a base vocabulary, how does it decide what to merge next, and when does it stop?"
  answer_keywords:
    - "most frequent adjacent pair"
    - "merges that pair"
    - "target vocabulary size"
  model_answer: "BPE starts from a base vocabulary of individual characters or bytes, with every word (or the whole training corpus) represented as sequences of these base symbols. At each iteration, it counts how often every pair of adjacent symbols co-occurs across the corpus, identifies the single most frequent adjacent pair, and merges that pair into one new symbol, which is added to the vocabulary as a new token. This repeats — recomputing adjacent-pair frequencies over the now partially-merged corpus and merging the new most frequent pair each round — until a predetermined target vocabulary size is reached, at which point the ordered list of merge rules learned during training is applied, in that same order, to tokenize new text at inference time."
  explanation: "BPE is a greedy, iterative, frequency-driven merge algorithm. It begins from the smallest possible symbol alphabet (characters or raw bytes) and, at every step, scans the corpus for the adjacent pair of symbols that co-occurs most often, then merges every occurrence of that pair into a new, single symbol. Because the corpus changes after each merge (some pairs disappear, new adjacent pairs appear where a merge just happened), the next most-frequent pair is recomputed on the updated corpus, and the process repeats. Training stops once the vocabulary reaches a chosen target size (or, in byte-level variants, once a fixed merge budget is exhausted); at inference time, the same sequence of learned merge rules is replayed in the order it was learned to tokenize new text deterministically."

- type: mcq
  question: "Vanilla GPT-2 uses learned absolute positional embeddings, LayerNorm, a GELU MLP feed-forward block, and standard multi-head attention throughout. Which pairing correctly matches a modern component to the specific limitation of the corresponding GPT-2-era piece that it addresses?"
  choices:
    - "RoPE replaces LayerNorm to reduce normalization compute; RMSNorm replaces the MLP block to add gating; SwiGLU replaces the positional embeddings to enable extrapolation; GQA replaces the embedding table to reduce vocabulary size"
    - "RoPE and RMSNorm both replace the attention mechanism itself, while SwiGLU and GQA both replace positional encoding, making each pair functionally redundant with the other"
    - "RoPE replaces learned absolute positional embeddings to give attention a relative-position property and better behavior beyond trained sequence lengths; RMSNorm replaces LayerNorm to cut normalization compute by dropping the mean-centering statistic; SwiGLU replaces the GELU MLP to improve modeling quality at matched parameter count via gating; GQA replaces full multi-head attention's per-head key/value projections to shrink the KV cache and speed up autoregressive inference at scale"
    - "All four components — RoPE, RMSNorm, SwiGLU, and GQA — address the exact same underlying problem, attention's quadratic compute cost in sequence length, just via different mechanisms"
  answer_index: 2
  explanation: "Each modern component targets a distinct GPT-2-era limitation: learned absolute positional embeddings have no representation for positions beyond the trained maximum and don't expose relative-offset structure to attention directly — RoPE addresses this by rotating Q/K pairs so their dot product depends on relative position. LayerNorm's mean-centering statistic contributes little benefit but costs compute — RMSNorm addresses this by dropping it. A plain GELU/ReLU MLP feed-forward block underperforms a gated variant at matched parameter count — SwiGLU addresses this with a gating mechanism, at a rescaled hidden dimension to keep parameter count comparable. Full multi-head attention's per-head key/value projections make the KV cache large during autoregressive decoding — GQA addresses this by sharing key/value heads across groups of query heads. None of the four is primarily about reducing attention's quadratic sequence-length compute cost (that's a separate line of work, e.g. sparse/linear attention variants), and the mismatched pairings in the other options don't correspond to what each component actually changes."

- type: mcq
  question: "Across LLaMA 1, LLaMA 2, and LLaMA 3, several architectural and training choices changed. Which statement correctly describes a real progression across these versions?"
  choices:
    - "LLaMA 1 used standard multi-head attention throughout; LLaMA 2 introduced grouped-query attention for its largest models specifically to shrink KV-cache size and support a longer context window; LLaMA 3 extended grouped-query attention to all model sizes and adopted a substantially larger tokenizer vocabulary, alongside a further increase in context length and pretraining token count"
    - "LLaMA 1 introduced grouped-query attention for every model size from the start, and LLaMA 2 and LLaMA 3 both reverted to standard multi-head attention for all sizes"
    - "Context length decreased with each successive LLaMA version, since longer context windows were found to consistently hurt downstream benchmark performance"
    - "The tokenizer vocabulary size shrank from LLaMA 1 to LLaMA 3, which reduced the number of tokens needed to represent the same text"
  answer_index: 0
  explanation: "LLaMA 1 (RoPE, RMSNorm, SwiGLU from the outset) used standard multi-head attention across all its model sizes. LLaMA 2 introduced grouped-query attention for its largest model to keep KV-cache size and inference cost manageable as context length grew, while smaller LLaMA 2 sizes kept standard MHA. LLaMA 3 adopted grouped-query attention across all model sizes (not just the largest), moved to a substantially larger tokenizer vocabulary (improving text compression, i.e. fewer tokens per unit of text, especially for non-English text and code), and further increased both context length and total pretraining token count relative to LLaMA 2. Context length and vocabulary size both grew across the lineage, not shrank, and GQA was adopted progressively later and more broadly, not present in LLaMA 1 and then removed — the other options invert these actual trends."

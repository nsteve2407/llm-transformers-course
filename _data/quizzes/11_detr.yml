# _data/quizzes/11_detr.yml
- type: mcq
  question: "DETR predicts a fixed set of N boxes in parallel, with no inherent ordering that corresponds to ground-truth objects. Why does computing a training loss against ground truth require first solving an assignment problem, rather than just computing a loss between the i-th prediction and the i-th ground-truth object directly?"
  choices:
    - "DETR's predictions come out of the decoder in an arbitrary order that has no natural correspondence to how ground-truth objects happen to be listed, and that order can shift from one training step to the next; pairing prediction i with ground-truth object i by raw index would inconsistently reward or penalize the same prediction slot for detecting different objects across images, so an assignment step first determines which predicted slot corresponds to which ground-truth object before any per-pair loss is computed"
    - "The assignment step exists purely to remove duplicate predictions from the fixed-size set of N before loss computation, performing the same duplicate-suppression role that non-max suppression performs at inference time in classical detectors"
    - "Ground-truth boxes are stored in a data format that must be sorted by class label before any loss can be computed, and the assignment step is simply this sorting operation applied to align class-label order between predictions and targets, rather than addressing box or object correspondence"
    - "DETR predictions are already produced in the same fixed order as the ground-truth annotation file for every image by construction of the parallel decoder, so an assignment step is only needed on the rare images where the predicted count N happens not to equal the number of ground-truth objects present, and this supposed built-in ordering is claimed to hold regardless of image content, object count, annotation-tool export format, or which dataset the annotations originally came from, none of which actually determines decoder output order in practice"
  answer_index: 0
  explanation: "The decoder produces N predictions in parallel with no built-in correspondence to ground-truth order, and that correspondence is not fixed across training steps or images. If prediction 0 were always compared to ground-truth object 0, the same prediction slot would be pushed toward detecting whatever object happens to be listed first in each image's annotations, which is an arbitrary and inconsistent target. The assignment step (solved via the Hungarian algorithm) instead first finds which predicted slot best corresponds to which ground-truth object for that specific image, and only then computes the per-pair classification and box loss. This is unrelated to duplicate removal (which decoder self-attention already handles), unrelated to sorting by class label, and predictions are not already aligned with annotation-file order by construction."

- type: mcq
  question: "Classical detectors like Faster R-CNN and YOLO produce many overlapping candidate boxes per object and rely on non-max suppression (NMS) as a post-processing step to reduce them to one box per object. What duplicate-detection problem does NMS solve, and why does DETR not need an NMS post-processing step?"
  choices:
    - "NMS solves the problem of predictions having the wrong class label by re-running classification on the highest-scoring box in each region, and DETR avoids needing it because its classification head is trained with a loss function that never misclassifies boxes"
    - "Classical detectors' dense, largely independent proposals or anchors frequently produce many high-scoring boxes clustered around the same object, so NMS greedily suppresses lower-scoring boxes that overlap a higher-scoring one past an IoU threshold; DETR's decoder self-attention lets object queries exchange information with each other during decoding, so the model learns to suppress redundant queries before output, leaving a final prediction set that is already de-duplicated without any separate post-processing step"
    - "NMS solves numerical instability that arises whenever a detector predicts more than one class simultaneously for a single pixel, and DETR avoids needing it because it predicts exactly one box per pixel of the input image, which guarantees no two predictions can ever refer to the same object"
    - "NMS exists to correct boxes whose predicted coordinates fall outside the image boundary, and DETR does not need it because its box predictions are clipped to the image boundary internally, which happens to also prevent duplicate detections as an unrelated side effect"
  answer_index: 1
  explanation: "Anchor- or proposal-based detectors generate many overlapping candidate boxes around the same object because nearby anchors/proposals independently score highly for it; NMS greedily keeps the highest-scoring box and suppresses others that overlap it past an IoU threshold. DETR's predictions are not independent in this way: decoder self-attention lets its N object queries interact with each other during decoding, and training against the one-to-one Hungarian-matched loss teaches queries to avoid redundantly covering the same object, so the raw output set is already de-duplicated. This has nothing to do with per-pixel classification, per-pixel box prediction, or boundary clipping."

- type: mcq
  question: "Classical detectors like Faster R-CNN densely tile the image with predefined anchor boxes at multiple scales and aspect ratios, then predict offsets relative to the nearest matching anchor. What problem do anchors solve for these detectors, and why does DETR dispense with them entirely?"
  choices:
    - "Anchors solve the problem of variable image resolution, letting a detector accept input images of any size without ever needing to resize them, and DETR dispenses with anchors because it instead requires every input image to be resized to one fixed resolution before any forward pass can begin, a resolution that is claimed to be hard-coded once at model construction time and never adjustable afterward regardless of backbone choice, dataset, deployment setting, downstream fine-tuning regime, or any other configuration choice a practitioner might otherwise expect to control"
    - "Anchors exist to provide the ground-truth labels themselves during training, replacing the need for a human-annotated dataset, and DETR dispenses with anchors because it is trained in a fully unsupervised way with no ground-truth boxes at all"
    - "Anchors give the detector a dense set of reference boxes at various scales and aspect ratios so that regression only has to predict small offsets from a reasonable starting point rather than raw coordinates from scratch, but they require hand-tuning scales and ratios per dataset and produce many redundant proposals needing NMS; DETR instead predicts a small fixed set of boxes directly via its object queries and set-based loss, with no predefined reference geometry and no redundant dense proposals to prune"
    - "Anchors solve the vanishing-gradient problem in very deep backbone networks by providing auxiliary supervision at intermediate layers, and DETR dispenses with anchors because its transformer encoder solves vanishing gradients through residual connections instead"
  answer_index: 2
  explanation: "Anchors give a detector a dense grid of pre-defined reference boxes at multiple scales/aspect ratios, so the regression head only needs to predict a small offset from a nearby anchor rather than raw coordinates from nothing -- but this requires hand-tuning anchor scales and ratios per dataset, and produces many redundant, overlapping proposals that then need NMS. DETR sidesteps all of this: object queries directly predict a small, fixed-size set of boxes with no predefined reference geometry, trained against a one-to-one set-prediction loss instead of anchor-based offset regression. This is unrelated to input-resolution handling, unrelated to supervision (DETR is trained with ground-truth labels, just like classical detectors), and unrelated to vanishing gradients."

- type: short
  question: "DETR's decoder takes N learned object queries as input rather than image features. Describe what an object query is, how it is used across training and inference, and what causes different queries to end up 'specializing.'"
  answer_keywords:
    - "fixed number of learned embedding vectors"
    - "cross attention with the encoder's image features"
    - "specialize in different regions or box size statistics"
  model_answer: "An object query in DETR is one of a fixed number of learned embedding vectors, N of them, that stay the same at inference time for every image -- they are not derived from the input image at all, unlike encoder tokens, which come from CNN feature-map positions. Each query is fed into the decoder as an input slot, and through decoder self-attention (letting queries exchange information with each other) and cross attention with the encoder's image features (letting each query pull in relevant image content), each query's representation is refined layer by layer into a final embedding that a shared feed-forward head turns into a class label and box. Because all N queries are trained jointly against the Hungarian-matched loss across the whole training set, individual queries tend to specialize in different regions or box size statistics -- for example, one query might consistently end up predicting small boxes concentrated in one part of the image across many training examples, purely as an emergent effect of how they are trained and matched, rather than because they were explicitly assigned to a region beforehand."
  explanation: "Object queries are a fixed set of N learned embeddings, shared across all images and frozen at inference, that serve as the decoder's input slots rather than being derived from the current image. Decoder self-attention lets queries coordinate with each other, and cross-attention against the encoder's output lets each query pull in image content relevant to whatever it is specializing toward. Because every query is optimized jointly against the Hungarian-matched set-prediction loss over the whole training distribution, queries emergently specialize -- for instance toward particular spatial regions or box-size ranges -- purely as a byproduct of training and matching, with no explicit region assignment built into the architecture."

- type: mcq
  question: "DETR uses the Hungarian algorithm to find the globally optimal one-to-one assignment between predictions and ground-truth objects, rather than a greedy heuristic that assigns each ground-truth object to its lowest-cost prediction one at a time. Why does the training objective specifically call for an optimal assignment rather than a greedy one?"
  choices:
    - "Greedy assignment is mathematically impossible to compute for any set of more than two objects, since it itself requires solving an NP-hard problem, whereas the Hungarian algorithm runs in constant time regardless of how many predictions or ground-truth objects there are"
    - "A greedy assignment would fail because it can only be applied to boxes of identical size and aspect ratio, and DETR's predicted boxes vary in these properties too much for any greedy scheme to ever produce a valid one-to-one pairing"
    - "The training loss is defined only for pairings produced by the Hungarian algorithm specifically, since Hungarian-matched pairs are the sole input format the cross-entropy and L1 loss functions in DETR were mathematically designed to accept, unlike pairings from any other assignment procedure"
    - "A greedy, first-come-first-served assignment can lock in a locally cheap early pairing that then forces a later ground-truth object to be matched to a poorly-fitting leftover prediction, since earlier greedy choices are never revisited; the Hungarian algorithm instead finds the assignment that minimizes total matching cost summed across all pairs simultaneously, so the set-prediction loss trains against a consistent, globally optimal correspondence rather than one that can vary in quality depending on arbitrary tie-breaking or object ordering"
  answer_index: 3
  explanation: "A greedy assignment commits to whichever pairing looks cheapest at each step and never revisits that choice, so an early low-cost pairing can strand a later ground-truth object with a leftover prediction that fits it poorly, and the resulting assignment quality depends on arbitrary tie-breaking or the order objects happen to be considered in. The Hungarian algorithm instead solves for the assignment that minimizes total cost summed across all pairs at once, giving a consistent, globally optimal correspondence to train against on every step. Greedy assignment is not NP-hard or impossible to compute, the Hungarian algorithm is not constant-time (it runs in polynomial time in the number of predictions/objects), box shape has nothing to do with why greedy fails, and the loss functions themselves are ordinary cross-entropy and L1/GIoU terms that work on any pairing, not just Hungarian output."

- type: short
  question: "DETR's Hungarian matching cost for a prediction/ground-truth pair combines three components: a classification term, an L1 box term, and a GIoU term. Why is L1 distance between box coordinates alone insufficient as a matching cost, motivating the addition of a GIoU term?"
  answer_keywords:
    - "same l1 distance can correspond to boxes of very different scales"
    - "small boxes are penalized far more than an equally sized l1 error"
    - "giou is scale invariant and directly reflects overlap"
  model_answer: "L1 distance between predicted and ground-truth box coordinates treats every box the same regardless of its size: the same l1 distance can correspond to boxes of very different scales, so an identical coordinate error is proportionally huge for a small box and nearly negligible for a large one -- in practice, small boxes are penalized far more than an equally sized l1 error would suggest is fair, while large boxes get an easy ride from the same absolute error. Adding a GIoU term to the matching cost fixes this because giou is scale invariant and directly reflects overlap between the predicted and ground-truth box as a fraction of their combined area, so pairing quality is judged by how well the two boxes actually align spatially rather than by a raw coordinate distance that scale can distort."
  explanation: "Raw L1 distance between box coordinates does not account for box scale: an identical absolute coordinate error represents a much larger relative distortion for a small box than for a large one, so matching cost computed from L1 alone systematically over-penalizes small objects and under-penalizes large ones. GIoU is scale-invariant and measures actual spatial overlap (with a penalty term that still produces gradient signal even for non-overlapping boxes), so combining it with the L1 term lets the matching cost reflect genuine box-alignment quality regardless of object size, rather than an absolute-distance artifact."

- type: mcq
  question: "Plain IoU (intersection over union) is zero for any two boxes that don't overlap at all, regardless of how far apart they are. Why is this a problem as a training signal, and how does generalized IoU (GIoU) fix it?"
  choices:
    - "When two boxes don't overlap, plain IoU is stuck at exactly zero no matter how close or far apart they are, so its gradient with respect to box coordinates is also zero in that regime, giving the model no signal about which direction to move a badly placed box toward the target; GIoU fixes this by subtracting a penalty term based on the area of the smallest enclosing box not covered by either box, which keeps shrinking as the two boxes move closer together even while they remain fully non-overlapping, producing a non-zero, informative gradient in exactly the case plain IoU cannot"
    - "Plain IoU is a problem because it can only be computed for boxes of identical width and height, and GIoU generalizes the formula to boxes of any aspect ratio by first resizing both boxes to a common shape before computing overlap"
    - "Plain IoU is undefined, rather than zero, for non-overlapping boxes, which causes numerical errors during backpropagation, and GIoU fixes this purely by adding a small numerical-stability constant to the IoU denominator so division by zero never occurs"
    - "Plain IoU already provides a perfectly usable gradient everywhere, including for non-overlapping boxes, so GIoU is not actually needed for gradient reasons at all; it exists only to make the loss magnitude fall within the 0 to 1 range for boxes that do overlap, a purely cosmetic normalization with no bearing on non-overlapping cases, and one that could just as well be achieved by simply clipping or rescaling plain IoU's output range after the fact rather than by introducing any new enclosing-box geometry whatsoever, regardless of how many boxes are involved or how far apart they might happen to be positioned"
  answer_index: 0
  explanation: "Plain IoU is flat at zero for any pair of non-overlapping boxes regardless of how far apart they are, so its gradient with respect to box coordinates is also zero there -- the model gets no signal about which direction to move a badly placed box. GIoU fixes this by subtracting the fraction of the smallest enclosing box's area not covered by either box; that penalty term keeps changing continuously as two non-overlapping boxes move closer together or farther apart, so it supplies a meaningful, non-zero gradient exactly where plain IoU goes flat. Plain IoU is well-defined (equal to zero, not undefined) for non-overlapping boxes, GIoU has nothing to do with aspect-ratio resizing, and plain IoU's zero-gradient problem is a real optimization issue, not one GIoU merely papers over cosmetically."

- type: mcq
  question: "Because DETR always predicts a fixed number of N boxes but a typical image has far fewer than N actual objects, most predictions must be matched to a special no-object (∅) class during Hungarian matching. Why does DETR down-weight the no-object class's contribution to the classification loss, rather than weighting it the same as every real object class?"
  choices:
    - "No-object down-weighting is required purely for numerical stability, since the classification loss would otherwise be undefined for the no-object class, unrelated to how many predictions get matched to no-object versus a real class"
    - "Since almost all of the N predictions get matched to no-object in a typical image (N is deliberately set well above the number of objects any image is likely to contain), the no-object class vastly outnumbers real object classes among the classification loss's training examples; weighting it identically to real classes would let this class imbalance dominate the loss and push the model toward the easy strategy of predicting no-object for a query rather than committing to hard-but-correct object predictions, so its loss contribution is scaled down to keep training focused on getting real object predictions right"
    - "The no-object class is down-weighted so that it can be entirely ignored at inference time, since down-weighting during training is what causes the model to stop producing no-object predictions altogether once training finishes"
    - "Down-weighting the no-object class exists to compensate for GIoU's zero-gradient problem on non-overlapping boxes, since no-object predictions never have an associated box target and would otherwise interact badly with the GIoU loss term specifically"
  answer_index: 1
  explanation: "N is chosen well above the typical number of objects per image, so most of the N predictions end up matched to no-object rather than a real class -- making no-object hugely overrepresented among classification-loss examples. Weighting it the same as real classes would let this imbalance dominate training and reward the model for defaulting to no-object rather than committing to correct, hard object predictions, so its loss contribution is scaled down. This is not a numerical-stability fix (the loss is well-defined either way), it does not eliminate no-object predictions at inference (they are still produced and simply filtered by confidence), and it has no direct relationship to GIoU's zero-gradient issue, which concerns box overlap, not classification."

- type: mcq
  question: "DETR's transformer encoder operates on the CNN backbone's flattened 2D feature map, but self-attention itself has no notion of spatial position -- it treats its input as an unordered set of tokens. What role do the spatial positional encodings added to the feature map play, and why are they needed at every encoder and decoder cross-attention layer rather than only once at the input?"
  choices:
    - "The positional encodings exist purely to increase the total parameter count of the network so it can fit larger datasets, and are added at every layer only so this parameter increase compounds across layers, with no relation to spatial information"
    - "Positional encodings replace the CNN backbone entirely by directly encoding each pixel's raw color value at its 2D coordinate, letting the transformer encoder skip processing the image through any convolutional layers before self-attention begins"
    - "They inject each flattened feature-map cell's 2D row/column position into its token representation, since without them self-attention would have no way to distinguish a token's spatial location -- two feature vectors could be swapped without changing the attention computation at all; DETR adds these positional encodings to the attention queries and keys at every layer where attention is computed, rather than only once at the input, because each layer's attention scores are computed fresh from that layer's own queries and keys, so positional information has to be reintroduced at each of those points to keep influencing where attention looks"
    - "Positional encodings are only needed in the decoder, never in the encoder, because the encoder processes CNN features that already retain spatial order implicitly through their memory layout, while the decoder's object queries have no such implicit order and require explicit encoding"
  answer_index: 2
  explanation: "Self-attention computes scores from queries and keys with no inherent sense of token order or position, so without positional encoding, two feature-map cells could be swapped without changing what attention computes -- spatial location would simply be invisible to it. DETR injects each cell's 2D row/column position into the queries and keys used at every attention computation, in both the encoder and the decoder's cross-attention, because each layer forms its own queries and keys fresh from that layer's representations; positional information added only once at the input would not automatically persist into every later layer's attention scores, so it is reintroduced at each point attention is computed. This has nothing to do with parameter count, does not replace the CNN backbone, and is needed in the encoder just as much as the decoder -- CNN feature-map memory layout does not itself encode position to self-attention."

- type: short
  question: "DETR is known to have several practical weaknesses compared to well-tuned classical detectors. Name at least two of these weaknesses, and briefly describe how Deformable DETR addresses them."
  answer_keywords:
    - "trains for far more epochs before converging"
    - "struggles to detect small objects"
    - "attends to only a small set of sampled points"
  model_answer: "DETR has a few well-documented weaknesses relative to well-tuned classical detectors. First, it trains for far more epochs before converging than a comparable Faster R-CNN, since object queries have to learn useful specialization patterns and the encoder's global attention has to learn spatial structure entirely from data, without any of the priors a CNN detector already has built in. Second, it struggles to detect small objects, partly because operating on a single, coarse final-stage feature map loses the fine spatial detail small objects need, unlike classical detectors that use a multi-scale feature pyramid. Third, the encoder's global self-attention over the flattened feature map is quadratically expensive, which becomes especially costly at the higher resolutions or multi-scale feature maps that would otherwise help with small objects. Deformable DETR addresses these by replacing global attention with deformable attention, where each query attends to only a small set of sampled points near a reference location rather than to every feature-map position, which is far cheaper, converges much faster during training, and can be applied efficiently across multiple feature-map scales at once, directly improving small-object detection while cutting training time."
  explanation: "Compared to well-tuned classical detectors, DETR is known to train for far more epochs before converging (often several times as many as Faster R-CNN), to struggle at detecting small objects (partly from relying on a single coarse feature map rather than a multi-scale pyramid), and to pay a quadratic attention cost over the flattened feature map that limits how much resolution or how many scales it can practically process. Deformable DETR's fix is deformable attention: instead of attending to every feature-map position, each query attends to only a small set of sampled points near a learned reference location, which is far cheaper, lets the model use multi-scale feature maps efficiently (helping small-object detection), and converges substantially faster during training."

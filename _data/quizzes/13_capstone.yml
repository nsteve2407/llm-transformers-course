# _data/quizzes/13_capstone.yml
- type: mcq
  question: "You're assembling a custom image dataset of roughly 1k-20k images for the ViT/Swin fine-tuning capstone option. Why is a plain random shuffle into train/val/test splits often not careful enough, and what should you check for instead?"
  choices:
    - "A random shuffle is risky mainly because it doesn't guarantee the test split ends up strictly larger than the training split, and reliable evaluation requires the test set to always be the largest of the three partitions; the fix is to compute split sizes first and force test to be the majority split regardless of how the images were collected or how many total images are available"
    - "A random shuffle is risky mainly because many training frameworks expect image files to already be sorted alphabetically by filename within each split directory before training will converge properly; the fix is to rename every file so the shuffle's output order matches alphabetical order before the split manifests are written, since these frameworks read split membership directly from that sorted file order rather than from any separate manifest or label file"
    - "A dataset this size is often collected in bursts or from a handful of sources, so near-duplicate images can land in different splits by chance; if that happens, the model can score well on val/test simply by having half-memorized a near-duplicate seen during training, so splits should be checked for near-duplicates and grouped by source or session where possible, alongside checking that each class is reasonably represented in every split"
    - "A random shuffle is risky mainly because it produces a different split every time the script is re-run; reproducibility instead requires assigning every image to a split by hashing its raw pixel values, since hashing is the only method that can guarantee two separate dataset-preparation runs, potentially performed months apart on different machines by different collaborators, never assign the same image to two different splits"
  answer_index: 2
  explanation: "Small, source-limited datasets often contain near-duplicate images -- burst-mode frames, multiple crops of one photo, or images from the same short capture session -- and a plain random shuffle can easily scatter near-duplicates of the same underlying scene across train and val/test. When that happens, a model can score well on evaluation simply by having half-memorized a near-duplicate seen during training, which inflates measured accuracy without reflecting real generalization to unseen content. The fix is to check for near-duplicates and, where possible, group by source/session so related images stay in the same split, alongside checking that each class is reasonably represented in every split. Split-size ordering, filename sorting, and pixel-hash-based splitting are not real considerations here."

- type: mcq
  question: "The ViT/Swin capstone option asks for accuracy on full fine-tuning, linear-probing (frozen backbone, train only the head), and partial unfreezing (e.g. the last few blocks) side by side, rather than picking one strategy and reporting a single number. What does comparing all three actually isolate, beyond just which one scores highest?"
  choices:
    - "Linear-probing measures how good the pretrained backbone's frozen features already are for this task, since only a new head gets trained on top of them; full fine-tuning measures the ceiling reachable when every layer can adapt, but risks overfitting on a small custom dataset; partial unfreezing sits in between, testing whether adapting just the later layers captures most of full fine-tuning's benefit at lower overfitting risk and compute cost -- comparing all three shows how much of the task is already solved by the pretrained representation versus how much requires further adaptation, which a single accuracy number from one strategy can't distinguish"
    - "All three strategies are mathematically guaranteed to converge to the same accuracy given enough training epochs, so comparing them is mainly a way to check whether any of the three training runs has a bug in its learning-rate schedule or optimizer configuration, rather than a way to learn anything about the pretrained backbone or the dataset itself"
    - "Linear-probing is strictly superior to the other two strategies on any dataset because freezing the backbone entirely prevents catastrophic forgetting of the pretrained features, which makes full fine-tuning and partial unfreezing obsolete techniques included in the comparison only for historical completeness rather than because either might actually win on a given dataset"
    - "Full fine-tuning always achieves the highest accuracy regardless of dataset size, so comparing it against linear-probing and partial unfreezing is useful only for benchmarking how much GPU memory and wall-clock training time each strategy consumes, not for learning anything about accuracy or generalization"
  answer_index: 0
  explanation: "Each strategy isolates a different question. Linear-probing (frozen backbone, new head only) measures how good the pretrained representation already is for this task without letting the backbone change at all. Full fine-tuning measures the ceiling reachable when every layer can adapt, but on a small custom dataset that extra flexibility comes with real overfitting risk. Partial unfreezing is a middle ground, testing whether adapting just the later layers captures most of full fine-tuning's benefit at lower overfitting risk and cost. Reporting all three side by side shows how much of the task the pretrained features already solve versus how much genuinely benefits from adaptation -- information a single number from one strategy can't provide. None of the strategies are guaranteed to converge to the same accuracy, linear-probing is not universally superior, and full fine-tuning does not always win on small datasets."

- type: mcq
  question: "Held-out perplexity, not training-set perplexity, is the number to report for the from-scratch language model trained on tiny Shakespeare. Why does training perplexity fail to answer the more important question of whether the model generalizes?"
  choices:
    - "Training perplexity and held-out perplexity are numerically identical for any model trained with a validation-based early-stopping criterion, so reporting either one conveys exactly the same information about generalization and the choice between them is purely a matter of convention rather than measurement accuracy"
    - "Training perplexity can only be computed while the optimizer is actively updating weights during the training loop itself, so once training finishes and the final checkpoint is saved to disk there is no way to compute it retroactively on that checkpoint at all; held-out perplexity is preferred simply because it can still be computed after training has already completed, on whichever checkpoint happens to be saved, rather than because of anything to do with what training-set perplexity actually measures about generalization"
    - "Held-out perplexity is preferred over training perplexity mainly because it is far cheaper to compute -- it only requires a single forward pass on a small held-out batch, whereas training perplexity would require re-running the entire multi-epoch training loop from scratch just to obtain one number"
    - "Training-set perplexity is optimistically biased: the model has seen that exact text repeatedly during optimization and can partly memorize it, so a low training perplexity can reflect memorization and overfitting rather than a genuine ability to predict text it hasn't seen; held-out perplexity, computed on text withheld from training, is what actually measures whether the model generalizes to new text"
  answer_index: 3
  explanation: "The model has repeatedly seen and updated on the training text during optimization, so it can partly memorize it -- a low training-set perplexity can therefore reflect memorization/overfitting rather than a genuine ability to predict unseen text. Held-out perplexity, measured on text withheld from training, is the number that actually reflects generalization, since the model has never had gradient updates from that specific text. Training perplexity remains computable after training finishes (nothing stops you from evaluating loss on the training set post-hoc), the two numbers are not identical, and the preference for held-out perplexity is about what it measures, not computational cost."

- type: mcq
  question: "Self-BLEU and distinct-n are reported alongside held-out perplexity when comparing sampling strategies (greedy, temperature, top-k, top-p) on generated text. What do they capture that perplexity alone can miss, and which direction indicates more diverse output?"
  choices:
    - "A model can have good held-out perplexity while a specific decoding setting still produces repetitive text, since perplexity is an average over a fixed eval set and doesn't directly inspect generated samples. Self-BLEU scores each sample against the model's other generated samples, not a ground-truth reference, so lower self-BLEU means less similarity between samples. Distinct-n is the fraction of unique n-grams among all generated n-grams, so higher distinct-n means less repetition -- lower self-BLEU and higher distinct-n both indicate more diverse output"
    - "Self-BLEU works exactly like standard BLEU, scoring each generated sample against the ground-truth reference text it's supposed to resemble rather than against the model's other generated samples, so a higher self-BLEU score means the generation more closely matches the reference, which indicates more diversity relative to typical output; distinct-n similarly measures how many n-grams a given sample shares with the reference text rather than how many unique n-grams appear among the generated samples, so a lower distinct-n indicates greater diversity from the reference"
    - "Distinct-n measures the fraction of generated n-grams that also appear somewhere in the training corpus, so a higher distinct-n score indicates the model is generating text copied more directly from data it memorized during training, which is the opposite of what a diversity metric is supposed to reward"
    - "Self-BLEU and distinct-n always move in exactly the same direction as held-out perplexity for any model and any decoding strategy, so reporting either metric on its own is fully redundant with reporting perplexity, and recommending all three side by side is mainly a matter of presentation style rather than because they can disagree"
  answer_index: 0
  explanation: "Held-out perplexity is an average measure over a fixed evaluation set and can look fine even when a particular decoding setting (e.g. greedy or low-temperature sampling) produces repetitive or generic generations at inference time -- perplexity doesn't directly inspect the generated samples themselves. Self-BLEU and distinct-n do: self-BLEU scores each generated sample against the model's other generated samples (not a ground-truth reference), so lower self-BLEU means the samples are less similar to each other, i.e. more diverse; distinct-n is the fraction of unique n-grams among all generated n-grams, so higher distinct-n means less repetition. Both lower self-BLEU and higher distinct-n indicate more diversity. Self-BLEU does not compare against a reference the way standard BLEU does, distinct-n is not about overlap with the training corpus, and these metrics can disagree with perplexity, which is exactly why they're reported alongside it rather than instead of it."

- type: mcq
  question: "Greedy decoding picks the single highest-probability token at every step. Why isn't greedy decoding the default choice in practice, and what do temperature, top-k, and top-p do differently?"
  choices:
    - "Greedy decoding is avoided mainly because computing an argmax over the vocabulary is computationally more expensive than sampling, since argmax requires fully sorting every token's probability before selecting one, whereas temperature, top-k, and top-p sampling are able to select a token without ever comparing probabilities to each other at all"
    - "Always taking the single highest-probability token ignores the rest of the distribution at every step, and that locally-safe choice compounds over many steps into text that is repetitive or generic, since the model keeps re-selecting whichever continuation looked locally likely rather than exploring plausible alternatives; temperature reshapes how sharply peaked the distribution is before sampling, top-k restricts sampling to the k highest-probability tokens, and top-p (nucleus) restricts sampling to the smallest set of tokens whose cumulative probability exceeds p -- top-k and top-p directly exclude the unreliable long tail of low-probability tokens, while temperature alone only reshapes how much weight that tail carries without removing it"
    - "Temperature, top-k, and top-p all work by running the model forward multiple additional times per generated token and averaging the resulting probability distributions together, trading extra compute for a smoother, more diverse output distribution than a single greedy forward pass could ever produce on its own"
    - "Greedy decoding is avoided specifically because it cannot be implemented without direct access to the original training corpus at generation time, since the argmax operation is defined in terms of which token appeared most frequently in training rather than in terms of the model's current output probabilities"
  answer_index: 1
  explanation: "Greedy decoding's failure mode is that always taking the single highest-probability token ignores the rest of the distribution, and that locally-safe choice compounds over many generation steps into repetitive or generic text, since the model keeps re-selecting whatever looked locally likely rather than exploring other plausible continuations. Temperature reshapes how sharply peaked the probability distribution is before sampling; top-k restricts sampling to the k highest-probability tokens; top-p (nucleus) restricts sampling to the smallest set of tokens whose cumulative probability exceeds a threshold p. All three introduce controlled randomness that avoids greedy's repetition problem, and top-k/top-p specifically also exclude the unreliable long tail of very low-probability tokens outright (temperature alone only reshapes how much weight that tail carries, without removing it). Argmax is not more expensive than sampling for this purpose, none of these methods require extra forward passes, and none require access to the training corpus at generation time."

- type: mcq
  question: "For the CLIP-based retrieval capstone option, recall@k and MRR are both computed from the same hand-labeled query-to-relevant-image evaluation set. How do the two metrics differ in what they reward?"
  choices:
    - "Recall@k is essentially a binary check of whether at least one relevant image appears anywhere in the top-k results for a given query, scored as 1 if so and 0 otherwise and then averaged across all queries in the hand-labeled evaluation set, and MRR is simply the count of relevant images that happen to appear within the top-k divided by k for that same query, again averaged across the full set of evaluation queries in the eval set, with neither metric being sensitive to the actual rank position of any individual relevant result within that top-k window"
    - "Recall@k measures the total number of images returned by a query regardless of whether any of them are actually relevant, and MRR measures the average rank position of the single least-relevant image among the results returned, so a lower MRR score under this definition would indicate a better-performing retrieval system"
    - "Recall@k, for a given query, is the fraction of that query's known-relevant images retrieved within the top-k (relevant-in-top-k divided by total relevant for that query), averaged across queries -- it rewards surfacing more relevant images within the top-k, not just any single one. MRR instead takes, for each query, 1 divided by the rank of the first relevant result, then averages across queries, rewarding an early first relevant hit regardless of what else appears further down"
    - "Recall@k and MRR are two different names for the exact same underlying computation over a query's ranked results, and the only reason a capstone write-up would report both is to express the same number twice, once as a fraction between 0 and 1 and once as an average rank"
  answer_index: 2
  explanation: "Recall@k is computed per query as the fraction of that query's known-relevant images that appear in the top-k results (relevant-in-top-k divided by total relevant for that query), then averaged across queries -- since a query can have several relevant images, recall@k rewards surfacing more of them within the top-k, not just any single one. It is not a binary at-least-one check (that would be a different metric, hit-rate@k). MRR instead takes, for each query, 1 divided by the rank of the first relevant result, then averages across queries, so it specifically rewards the first relevant result appearing earlier, regardless of how many other relevant images also show up further down the ranking. The two measure genuinely different things and are not interchangeable."

- type: mcq
  question: "A confusion matrix is reported for the ViT/Swin capstone option alongside overall accuracy. What does it reveal that a single accuracy number doesn't, and what does it still fail to show on its own?"
  choices:
    - "A confusion matrix directly shows why the model makes each type of mistake, by displaying the specific image regions responsible for each misclassification inside each off-diagonal cell of the grid itself, computed automatically from the same forward pass used to generate the predictions, so a separate technique like attention-rollout or Grad-CAM adds nothing further once a confusion matrix has already been produced for the test set"
    - "The off-diagonal entries of a confusion matrix show which specific classes get confused with which, rather than just an aggregate error rate, revealing patterns like two visually similar classes being mixed up far more than others; on its own, though, it doesn't explain why those errors happen or point to which specific examples were misclassified, and it can hide the fact that some misclassifications matter more than others when error costs aren't symmetric, which is why it's paired with highest-confidence wrong predictions and attention-rollout/Grad-CAM"
    - "A confusion matrix's only real function is to compute the same overall accuracy number in a more visually appealing grid layout, since summing its diagonal cells and dividing by the total reproduces the accuracy score exactly, and the off-diagonal cells don't carry any information beyond that single number"
    - "A confusion matrix's diagonal entries represent incorrect predictions and its off-diagonal entries represent correct ones, so a matrix with a sparsely populated diagonal and densely populated off-diagonal cells is actually the signature of a well-performing classifier"
  answer_index: 1
  explanation: "A confusion matrix's off-diagonal entries show which specific classes get confused with which, revealing patterns -- like two visually similar classes being mixed up disproportionately -- that a single accuracy number collapses away. But on its own it doesn't explain why those errors happen, and it doesn't point to which specific examples were misclassified; that's what inspecting highest-confidence wrong predictions and attention-rollout/Grad-CAM visualizations are for. It can also hide the fact that some misclassifications matter more than others when error costs aren't symmetric across classes. It does not itself show the image regions responsible for errors (that requires a separate visualization technique), it is not merely a rearrangement of the accuracy number, and its diagonal represents correct predictions, not incorrect ones."

- type: short
  question: "Each capstone option lists 'stretch goals' beyond its core deliverables. Explain what role stretch goals are meant to play relative to the core deliverables, and how that should shape how you scope your ~1-2 week part-time project."
  answer_keywords:
    - "stretch goals are optional and secondary to the core deliverables"
    - "core deliverables should be completed and evaluated solidly first"
    - "only attempt stretch goals if time remains after the core work is done"
  model_answer: "Stretch goals are optional and secondary to the core deliverables -- they're extra ideas to pursue if time allows, not requirements, and a project that fully completes and evaluates its core deliverables well is a complete, successful capstone even with zero stretch goals attempted. Given the project is scoped for roughly 1-2 weeks of part-time work, the core deliverables should be completed and evaluated solidly first, since a working end-to-end project with honest, well-reported evaluation is worth far more than a half-finished project that spread its limited time across stretch goals instead. Practically, that means only attempt stretch goals if time remains after the core work is done, and it's fine -- expected, even -- to skip them entirely rather than rushing the core evaluation to fit one in."
  explanation: "Stretch goals are explicitly optional and secondary to the core deliverables -- they exist as extra directions to explore if time allows, not as requirements, so a project can be a complete success with all core deliverables done well and zero stretch goals attempted. Given the realistic ~1-2 week part-time scope, the core deliverables should be completed and evaluated solidly first, since a fully working project with honest evaluation is worth far more than a rushed core plus an attempted stretch goal. The practical rule is to only attempt stretch goals if time remains after the core work is done, treating them as a bonus rather than something to protect time for at the expense of the core evaluation."

- type: short
  question: "Beyond a confusion matrix and highest-confidence wrong predictions, the ViT/Swin capstone option also calls for attention-rollout or Grad-CAM visualizations. What do these add to error analysis that the other two don't provide?"
  answer_keywords:
    - "attention rollout and grad cam show where in the image a prediction is coming from"
    - "comparing these maps on correct versus incorrect examples reveals whether errors come from looking at the wrong region"
    - "neither a confusion matrix nor a list of wrong predictions shows what part of the image the model actually attended to"
  model_answer: "A confusion matrix shows which classes get confused with which, and highest-confidence wrong predictions surface specific examples worth a closer look, but neither a confusion matrix nor a list of wrong predictions shows what part of the image the model actually attended to when making its prediction. Attention rollout and grad cam show where in the image a prediction is coming from -- attention-rollout traces attention weights back through a ViT's layers into a rough map of influential image regions, and Grad-CAM uses gradients flowing into a convolutional layer to do the same for CNN-like architectures. Comparing these maps on correct versus incorrect examples reveals whether errors come from looking at the wrong region of the image, a genuine visual/attention failure, versus from noisy scores on an image the model was actually looking at correctly -- a distinction neither the confusion matrix nor the misclassified-example list can make on their own."
  explanation: "Attention rollout and grad cam show where in the image a prediction is coming from, tracing attention weights (ViT) or gradients into a convolutional layer (CNN-like architectures) back into a rough map of which image regions drove the prediction. Neither a confusion matrix nor a list of wrong predictions shows what part of the image the model actually attended to -- both tell you which class or which example was wrong, not where in the image the model was looking. Comparing these maps on correct versus incorrect examples reveals whether errors come from looking at the wrong region of the image, as opposed to noisy scores on an image the model was actually attending to correctly, which is a distinction the other two techniques cannot draw on their own."

- type: short
  question: "Each capstone option's write-up names specific evaluation metrics up front (e.g. held-out perplexity and self-BLEU, or accuracy and confusion matrices, or recall@k and MRR) rather than leaving evaluation as an afterthought. Why does an open-ended, self-directed capstone still benefit from defining this kind of explicit evaluation plan before you start building, rather than figuring out how to measure success after the project is mostly done?"
  answer_keywords:
    - "defining metrics upfront forces you to decide concretely what success actually means before writing code"
    - "without a plan it is easy to build something and only afterward realize you have no rigorous way to tell if it worked"
    - "an evaluation plan defined in advance also shapes what data you need to collect such as a held out split or a hand labeled eval set"
  model_answer: "An open-ended project has no externally imposed benchmark to check against, so defining metrics upfront forces you to decide concretely what success actually means before writing code, rather than leaving 'did this work' as a vague, after-the-fact judgment call. Without a plan it is easy to build something and only afterward realize you have no rigorous way to tell if it worked -- for example, discovering only at the end that you never held out a validation split, or never wrote down which images should count as relevant to a retrieval query. An evaluation plan defined in advance also shapes what data you need to collect such as a held out split or a hand labeled eval set, both far easier to set up before generating a lot of data or writing a lot of code than to retrofit afterward, and having the plan in place from the start keeps the project honest -- it separates 'I built something that runs' from 'I can show, with numbers, that it does what I wanted.'"
  explanation: "An open-ended capstone has no externally imposed benchmark, so defining metrics upfront forces you to decide concretely what success actually means before writing code, rather than leaving it as a vague after-the-fact judgment. Without a plan it is easy to build something and only afterward realize you have no rigorous way to tell if it worked -- for example, discovering too late that no validation split was ever held out, or that no hand-labeled relevance judgments were collected for a retrieval eval set. An evaluation plan defined in advance also shapes what data you need to collect such as a held out split or a hand labeled eval set, both of which are much cheaper to arrange before the bulk of the implementation work than to retrofit afterward, which is why every capstone option's write-up names its metrics up front rather than leaving them until after the project is built."

# _data/quizzes/07_rl_for_llms.yml
- type: mcq
  question: "RLHF's PPO stage optimizes reward = RM_score(x, y) − β·KL(π_θ || π_ref) rather than maximizing the raw reward model score alone. What problem does subtracting a KL penalty against a frozen reference policy solve?"
  choices:
    - "It removes the need to train a separate reward model at all, since the KL term alone supplies a complete training signal directly from the reference policy's own frozen output distribution and history"
    - "It guarantees the policy's output distribution stays close to uniform across the vocabulary, which improves generation diversity regardless of what the reward model scores"
    - "It constrains the policy from drifting far from the reference policy, keeping it where the reward model's scores stay trustworthy and discouraging reward hacking"
    - "It converts PPO's clipped surrogate objective into an ordinary supervised classification loss identical to next-token prediction, removing the need for sampled rollouts"
  answer_index: 2
  explanation: "The learned reward model is only accurate near the distribution of outputs it was trained on (typically outputs from something close to the SFT policy). If the policy were free to drift arbitrarily far in pursuit of raw reward score, it could find degenerate outputs that the RM happens to score highly but that a human would not actually prefer — reward hacking. Subtracting β times the KL divergence from the frozen reference (usually the SFT checkpoint) penalizes the policy for moving too far from that trusted region, keeping it near outputs the RM can meaningfully evaluate while still allowing it to improve. It does not eliminate the reward model, has nothing to do with vocabulary-level uniformity (that would be an entropy bonus, a different mechanism), and PPO still requires sampled rollouts from the current policy regardless of the KL term."

- type: mcq
  question: "The reward model is trained using a Bradley-Terry pairwise preference model, where P(chosen ≻ rejected) = σ(r(chosen) − r(rejected)). What does this model assume about preferences, and what does the reward model's training loss actually do?"
  choices:
    - "It assumes preference probability is a function of the difference between two reward scores; training maximizes the log-likelihood of the observed chosen/rejected pairwise labels"
    - "It assumes every human annotator is equally reliable and removes any need to model disagreement, replacing individual preference labels with one averaged reward score per pair"
    - "It assumes preferences are always transitive and consistent across every possible pair, so a complete, exact ranking of all completions can be recovered from a finite set of comparisons"
    - "It assumes reward differences are proportional to token-level edit distance between two completions, so completions that are more textually similar get closer reward scores"
  answer_index: 0
  explanation: "Bradley-Terry models the probability that one item is preferred over another as a logistic function of the difference between their underlying scalar scores — that's exactly what σ(r(chosen) − r(rejected)) expresses. The reward model's training loss is the corresponding pairwise logistic (log-likelihood) loss over the labeled comparisons: it pushes r(chosen) above r(rejected) by however much is needed to match the observed preference rate. The model makes no claim about annotator reliability (real RLHF pipelines have to handle noisy, disagreeing annotators separately), does not guarantee a globally consistent, exactly recoverable total ranking (real human preferences can be intransitive; Bradley-Terry is a convenient probabilistic approximation, not a proof of consistency), and has nothing to do with edit distance between completions' text."

- type: short
  question: "DPO's key move is to show that, given the RLHF KL-constrained objective, the optimal policy has a closed form in terms of the reward function. Explain what DPO eliminates from the RLHF pipeline as a result, and what its loss function directly optimizes instead."
  answer_keywords:
    - "separate reward model"
    - "implicit reward"
    - "log probability ratios"
    - "classification style loss"
  model_answer: "DPO eliminates the separate reward model entirely, along with the explicit RL optimization/rollout step. Because the optimal RLHF policy has a closed form as a function of the reward, DPO substitutes that closed form into the Bradley-Terry preference loss, so the explicit reward term cancels out and is replaced by log probability ratios between the current policy and the frozen reference policy. The result is a single classification style loss computed directly on (prompt, chosen, rejected) triplets, using those log probability ratios as an implicit reward, with no reward model to train and no on-policy sampling required."
  explanation: "Standard RLHF trains an explicit reward model, then runs PPO to optimize the policy against it under a KL constraint. DPO observes that the KL-constrained objective's optimal policy can be written in closed form as a function of the reference policy and the reward; inverting that relationship lets you express the reward implicitly in terms of a policy's own log-probabilities relative to the reference. Substituting this back into the Bradley-Terry preference loss produces a loss that depends only on the policy's log-probabilities on the chosen and rejected completions — no separate reward model is ever trained, and no rollouts are sampled from the policy during training, since the (prompt, chosen, rejected) data is fixed upfront. The tradeoff is that DPO never has an explicit, reusable reward model or an on-policy training signal; both are implicit and baked into the frozen offline dataset."

- type: mcq
  question: "GRPO (Group Relative Policy Optimization) removes PPO's separate critic/value network. What replaces the critic's role, and why is this change well suited to LLM RL fine-tuning?"
  choices:
    - "GRPO trains a smaller, distilled version of the critic that only runs at inference time, keeping PPO's advantage estimation formula unchanged but making it cheaper to evaluate"
    - "GRPO replaces the critic with the KL penalty term itself, treating divergence from the reference policy as a direct substitute for a learned value estimate at every token"
    - "GRPO drops the reward model along with the critic, relying only on the relative ranking of completions within a group, with no numeric reward signal used anywhere"
    - "For each prompt, GRPO samples a group of completions, scores each with the reward function, and normalizes each completion's reward against the group's mean and standard deviation to form its advantage"
  answer_index: 3
  explanation: "PPO's critic is a learned value network trained to predict expected future reward from a partial sequence, used to compute a lower-variance advantage estimate (often via GAE) — but training a second network the size of the policy, with a meaningful per-token value head, adds real cost and complexity for LLM fine-tuning. GRPO sidesteps this: for a given prompt, it samples several completions from the current policy, scores each one with the reward function, and computes each completion's advantage as its reward normalized (mean-subtracted, std-divided) against the rest of the group, using that shared baseline in place of a learned value estimate. This is well suited to LLMs because sampling several completions per prompt is already cheap relative to training a full second network, and reward is typically only available at the end of a completion anyway, which limits what a token-level critic would add. GRPO still needs a reward signal — it doesn't discard the reward model or reduce to pure ranking — and the KL term remains a separate penalty term, not a stand-in for a value estimate."

- type: short
  question: "RLVR (Reinforcement Learning with Verifiable Rewards) replaces a learned reward model with a rule-based reward function for domains like math and code. What makes a reward 'verifiable' in this sense, and why does this approach break down for open-ended tasks like creative writing or open-domain dialogue?"
  answer_keywords:
    - "deterministic automatic procedure"
    - "unit tests"
    - "no ground truth answer"
    - "subjective"
  model_answer: "A reward counts as verifiable when correctness can be checked by a deterministic, automatic procedure with no learned model or human judgment involved — for example, comparing a math answer against a known solution, or running generated code against unit tests and checking whether it passes. This sidesteps reward hacking against a learned reward model's blind spots, since there is no learned proxy to exploit; the reward is either directly computed from ground truth or trivially checkable. It breaks down for open-ended tasks like creative writing or open-domain dialogue because there is no ground-truth answer or automatic checker to compare against — quality there is inherently subjective and cannot be reduced to an exact-match rule, which is exactly the gap a learned reward model was originally meant to fill."
  explanation: "Verifiability means a reward can be computed by a fixed, automatic rule rather than a learned approximator: a math solution can be checked against a known final answer, generated code can be run against a test suite, output format can be checked against a schema. Because the rule is fixed and not learned, there is no reward-model blind spot for the policy to exploit, which is why RLVR sidesteps reward hacking in the sense that plagues learned RM optimization. The catch is that this only works where 'correct' has an objective, checkable definition. Creative writing, open-domain dialogue, and most everyday assistant queries don't have a single checkable ground truth — quality is a matter of subjective human judgment — so RLVR alone has nothing to optimize against there, and these domains still need either a learned reward model or human feedback rather than a verifiable rule."

- type: mcq
  question: "PPO's clipped surrogate objective clips the probability ratio r(θ) = π_θ(a|s)/π_θ_old(a|s) to the range [1−ε, 1+ε] before taking the minimum with the unclipped term. What does this clipping actually prevent?"
  choices:
    - "It guarantees the policy's parameters never change by more than ε at any single gradient step, functioning as a hard cap directly on the optimizer's effective learning rate"
    - "It removes the incentive to keep pushing the policy further in a direction that has already produced a large probability-ratio change within one update, discouraging destructively large policy updates"
    - "It bounds the reward model's output score to the range [1−ε, 1+ε] directly, preventing the reward function from ever producing a value below zero"
    - "It forces the KL penalty term to equal exactly zero for the first ε fraction of training steps, giving the policy an unconstrained warmup period before regularization begins"
  answer_index: 1
  explanation: "Once r(θ) for a given action has moved outside [1−ε, 1+ε], the clipped term stops providing gradient in the direction that would push it further outside that range (the min with the unclipped term means the objective no longer rewards making the ratio even more extreme), so the update for that action is effectively capped. This targets the specific failure mode PPO is designed around: a single large policy update based on a rollout collected under the old policy can move the policy so far that the old rollout's advantage estimate becomes badly wrong for the new policy, a problem TRPO addressed with an explicit trust-region constraint and PPO approximates with this cheaper clipping trick. It's not a literal cap on parameter change or learning rate (the clip acts on the probability ratio per action, not on parameters directly), has nothing to do with bounding the reward model's output, and doesn't touch the KL penalty term, which is a separate mechanism applied on top."

- type: mcq
  question: "PPO-based RLHF requires sampling fresh completions from the current policy at every training iteration (on-policy), while DPO trains directly on a fixed, pre-collected dataset of (prompt, chosen, rejected) pairs (offline). What is a direct practical consequence of this difference?"
  choices:
    - "PPO needs a generation/inference step interleaved with every training update, adding infrastructure complexity and cost that DPO avoids since its preference data is fixed upfront"
    - "DPO cannot use preference data collected under a different, earlier policy than the one currently being trained, since offline training requires the data source and target policy to match exactly"
    - "PPO's on-policy sampling means it never needs a reward signal of any kind, since freshly sampled rollouts substitute directly for a reward function"
    - "DPO's reliance on a static dataset means it can never be followed by any further RL fine-tuning stage, making the two approaches mutually exclusive within one pipeline"
  answer_index: 0
  explanation: "On-policy PPO must repeatedly generate completions from whatever the current policy is, score them with the reward model, and update — generation, reward scoring, and optimization are interleaved in a loop that requires serving the policy for inference throughout training, which is a real systems cost. DPO's preference data is collected once (often from a different, earlier model, or even from human-written comparisons) and training is then just gradient descent over that fixed dataset with no generation step required — which is precisely why offline data collected under a different policy is usable at all, contradicting the second option. PPO still absolutely needs a reward signal (the reward model) to score its rollouts. And nothing prevents DPO from being followed by further RL fine-tuning stages in a broader pipeline; the two techniques are not inherently mutually exclusive."

- type: mcq
  question: "As PPO-RLHF training proceeds against a fixed learned reward model, the policy's RM score keeps climbing while human-judged quality plateaus or declines. What is this phenomenon, and what is one standard mitigation besides the KL penalty already present in the objective?"
  choices:
    - "This is expected, healthy convergence: RM score and human judgment are mathematically guaranteed to track each other, so any divergence indicates a bug in how the RM was trained rather than a property of the optimization"
    - "This is caused by the policy's output entropy collapsing to a single deterministic completion, and the standard fix is to raise the learning rate so the policy keeps exploring new completions"
    - "This is reward hacking / over-optimization, where the policy exploits blind spots in the reward model; mitigations include reward model ensembling or periodically retraining the RM on fresh policy outputs"
    - "This only occurs when the reward model is undertrained relative to the policy, and the fix is to freeze the policy until the reward model completes an entirely separate, longer training run"
  answer_index: 2
  explanation: "A learned reward model is only an approximation of true human preference, fit on a finite, static set of comparisons. Nothing guarantees it stays accurate as the policy explores parts of output space far from what it was trained on — RM score and true quality can and do diverge, which is exactly what reward hacking / over-optimization looks like. Standard mitigations beyond the KL penalty include training an ensemble of reward models and using their disagreement as a signal, periodically collecting fresh human comparisons on the current policy's outputs and retraining the RM, or (as covered elsewhere in this module) swapping in verifiable rewards where possible. It is not evidence of a training bug, entropy collapse with more learning rate is not the standard diagnosis or fix, and it is not specifically an artifact of an undertrained RM that resolves by freezing the policy."

- type: short
  question: "In the RLHF pipeline, the same SFT (supervised fine-tuned) checkpoint plays two distinct roles once PPO training starts. What are those two roles, and why does using the same checkpoint for both matter for the KL penalty term to behave as intended?"
  answer_keywords:
    - "frozen reference policy"
    - "initialization for the policy"
    - "starting point"
    - "same weights"
  model_answer: "The SFT checkpoint is used both as the initialization for the policy that PPO continues to train, and, separately, as the frozen reference policy that the KL penalty measures divergence against throughout RL fine-tuning. Because the reference policy is a frozen copy of the exact same weights the policy started from, the KL term at the very start of PPO training is zero and grows only as the policy is pushed away from that shared starting point by RL updates — this is what makes the KL penalty a meaningful measure of how far RL has taken the model from the reasonable, instruction-following behavior established at the end of SFT, rather than an arbitrary or uncalibrated distance to some unrelated distribution."
  explanation: "SFT produces a single checkpoint that gets reused twice: once as the trainable policy's starting weights for PPO, and once as a separate, frozen copy kept fixed for the entire RL stage purely to compute the KL penalty against. Using the same checkpoint for both is what makes the KL term interpretable — at step zero the policy and reference are identical, so KL divergence starts at exactly zero, and every subsequent bit of KL reflects real drift introduced by RL updates rather than some pre-existing mismatch. If the reference policy were a different checkpoint (say, an earlier or later SFT run, or a differently-tuned model), the KL penalty would instead be measuring distance to an arbitrary, less meaningful target, undermining its purpose of keeping the policy anchored near the trusted, evaluated behavior that SFT established."

- type: mcq
  question: "DeepSeek-R1-Zero and DeepSeek-R1 both start from the same base model but take different paths. How do their training pipelines differ, and what tradeoff did R1-Zero reveal?"
  choices:
    - "R1-Zero and R1 use identical training pipelines; the only difference between them is that R1-Zero was evaluated on math benchmarks while R1 was evaluated on coding benchmarks instead"
    - "R1-Zero skips SFT entirely, applying large-scale RL with verifiable rewards to the base model; it reasoned well but read poorly and mixed languages, which R1's added stages fixed"
    - "R1-Zero applies SFT on human-written chain-of-thought demonstrations before any RL is applied, while R1 is the pure-RL, no-SFT variant of the two models"
    - "R1-Zero and R1 both depend entirely on a learned reward model with no rule-based verification, differing only in the total number of PPO iterations each was trained for"
  answer_index: 1
  explanation: "R1-Zero applies large-scale RL with verifiable, rule-based rewards (correctness of math/code outputs, format checks) directly to the base model, with no SFT stage at all — and it works, in the sense that strong chain-of-thought reasoning emerges purely from RL. But the resulting model has practical problems: poor readability and mixing of languages within a single response, since nothing in a purely verifiable-reward objective specifically rewards producing clean, single-language, human-readable text. R1 addresses this with a multi-stage pipeline — a small cold-start SFT phase on curated long-CoT data, followed by large-scale RL, then rejection sampling to build a further supervised dataset, then a final RL stage — trading some of R1-Zero's simplicity for a model that reasons well and also reads cleanly. The other options either invert which model has SFT, mischaracterize the eval difference as the only distinction, or wrongly claim neither model uses rule-based/verifiable rewards."

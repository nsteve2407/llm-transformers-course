# _data/quizzes/09_vit.yml
- type: mcq
  question: "The original ViT paper found that trained from scratch on ImageNet-1k, ViT underperformed a comparably-sized ResNet, but ViT overtook CNNs once pretrained on a much larger dataset (JFT-300M) and then fine-tuned. What explains this pattern?"
  choices:
    - "ViT's self-attention layers are fundamentally less expressive than convolution at every training-data scale, so it can only approach CNN accuracy asymptotically as data grows but can never actually match it in practice, since convolution's local filters supposedly impose a hard mathematical ceiling on representational capacity that no amount of additional pretraining data, model scaling, or fine-tuning could ever overcome"
    - "ViT lacks CNNs' built-in inductive biases like locality and translation equivariance, so on smaller datasets it must learn image structure from data alone, which needs far more examples than a CNN's prior already encodes; at large pretraining scale, the extra data compensates for the missing bias and ViT can match or exceed CNN accuracy"
    - "The gap is purely an optimization artifact caused by the [CLS] token's initialization scheme, and it disappears once position embeddings are removed entirely, regardless of how much training data is used"
    - "ResNets actually match or exceed ViT accuracy at every data scale tested in the original paper; the reported crossover was an artifact of using different learning-rate schedules for each architecture family"
  answer_index: 1
  explanation: "CNNs bake in priors -- locality, translation equivariance, weight sharing -- that give them a head start on image structure even with limited data. ViT's plain transformer encoder starts with none of these priors, so on small/mid-sized datasets it has to learn spatial structure entirely from examples, and underperforms a CNN of similar size. That same lack of built-in bias becomes an advantage at large scale: with enough pretraining data, ViT can learn whatever structure is actually useful for the task rather than being constrained by a fixed architectural prior, letting it match or surpass CNNs once pretrained on hundreds of millions of images and fine-tuned. This is not a permanent expressiveness ceiling, not an artifact of the [CLS] token or position embeddings, and the original paper's crossover is not explained away by mismatched learning-rate schedules."

- type: mcq
  question: "ViT borrows the [CLS] token idea from BERT: a learnable embedding prepended to the sequence of patch embeddings, whose final-layer output feeds the classification head. Why use a dedicated [CLS] token rather than, say, average-pooling the final-layer patch embeddings directly?"
  choices:
    - "Average-pooling over patch embeddings is mathematically undefined for a transformer encoder, since self-attention requires an odd number of tokens in the sequence to normalize its softmax correctly"
    - "A dedicated token gives the classification representation its own learnable embedding that attention layers can route information into from every patch, without forcing that representation to be a fixed, unweighted average of patch outputs; the paper's own ablation found global average pooling can work comparably given a different learning rate, so the choice is more a design convention borrowed from NLP than a strict necessity"
    - "The [CLS] token replaces position embeddings entirely, since its presence lets the model infer positional order implicitly from the order in which tokens are attended to across layers"
    - "Using a [CLS] token is required because self-attention cannot process a variable-length sequence unless one token is designated as a fixed aggregation point during the forward pass, and without such a token the encoder's attention matrix would be undefined for any batch containing images that produce different patch counts or resolutions from one another"
  answer_index: 1
  explanation: "The [CLS] token is a learnable embedding that participates in self-attention alongside the patch tokens at every layer, letting it accumulate a classification-specific representation shaped by attention weights rather than a fixed averaging rule. Notably, the ViT paper's own appendix ablation shows that replacing the [CLS] token with global average pooling over the final patch embeddings reaches comparable accuracy, provided the learning rate is retuned -- so the [CLS] token is not strictly necessary for good performance, it is largely a convention carried over from BERT-style NLP transformers for architectural consistency and a clean classification interface. Self-attention handles variable-length sequences fine without any designated token, and the [CLS] token has nothing to do with providing positional information -- that is the separate job of position embeddings."

- type: short
  question: "CNNs have built-in inductive biases that ViT's plain transformer encoder lacks. Name at least two such biases and briefly describe what each one assumes about images."
  answer_keywords:
    - "locality assumes nearby pixels are related"
    - "translation equivariance shifts the output feature map"
    - "reuses the same filter weights at every location"
  model_answer: "CNNs have at least three built-in inductive biases that ViT's plain encoder lacks. Locality assumes nearby pixels are related and restricts each convolution to a small receptive field, so long-range relationships have to be built up gradually across many layers. Translation equivariance shifts the output feature map whenever the input shifts, so a pattern is recognized the same way no matter where it appears in the image. And weight sharing reuses the same filter weights at every location, rather than learning a separate weight for every spatial position. ViT's self-attention and independent per-patch linear projection encode none of these priors from the start -- attention can connect any two patches from the very first layer, and there is no forced reuse of weights across positions -- so ViT has to learn whatever local structure and positional regularities are useful directly from data, which is a big part of why it needs far more pretraining than a CNN to reach comparable accuracy."
  explanation: "CNNs encode at least three priors about images directly into their architecture: locality (nearby pixels are assumed more related, enforced via small receptive fields), translation equivariance (shifting the input shifts the output feature map correspondingly, so a detector works the same way anywhere in the image), and weight sharing (the same convolutional filter is reused across every spatial position instead of learning separate weights per location). ViT's plain self-attention layers and independent per-patch linear projection do not build any of these assumptions in structurally -- attention can connect distant patches from layer one, and nothing forces weight reuse across positions. ViT must instead learn whatever local and positional structure turns out to be useful purely from data, which is the core reason it needs substantially more pretraining data than a CNN to reach comparable accuracy."

- type: mcq
  question: "The original ViT paper ablates several position-embedding schemes: no position embeddings, standard 1D learned embeddings (one learned vector per sequence index), and 2D-aware or relative embeddings that explicitly encode row/column structure. What did the ablation find, and what did ViT adopt as its default?"
  choices:
    - "2D-aware embeddings substantially outperformed 1D learned embeddings because they let the model exploit the image's grid structure directly, so ViT adopted a fixed 2D sinusoidal scheme as its default configuration"
    - "No position embeddings performed just as well as 1D or 2D schemes, since self-attention over patches is already permutation-invariant in a way that implicitly encodes spatial order, so ViT dropped position embeddings entirely in its final configuration"
    - "1D learned position embeddings performed about as well as 2D-aware or relative schemes, with little measurable benefit from encoding 2D structure explicitly, so ViT adopted the simpler 1D learned embeddings as its default, added directly to each patch embedding before the encoder"
    - "2D-aware embeddings were required for the model to converge at all; without them, training loss failed to decrease from its initial value regardless of learning rate or model size"
  answer_index: 2
  explanation: "The ablation compared no position embeddings against 1D learned embeddings and against schemes that explicitly encode 2D row/column structure or relative position. Dropping position embeddings entirely clearly hurt accuracy (self-attention has no inherent notion of token order, so patches would be treated as an unordered set without them), while the 2D-aware and relative variants performed about the same as the much simpler 1D learned embeddings -- explicit 2D structure did not measurably help. Because of this, ViT adopted plain 1D learned position embeddings, added directly to each patch's linear projection before the encoder, as its default, rather than the more complex 2D or relative alternatives."

- type: mcq
  question: "ViT's patch size P controls both the number of tokens N = HW/P^2 fed to the encoder and how much raw image content is folded into a single token's linear projection. What is the practical tradeoff of choosing a smaller patch size (e.g. 14x14 instead of 32x32) at a fixed image resolution?"
  choices:
    - "Smaller patches produce a longer sequence, and since self-attention's cost scales quadratically with sequence length, compute grows sharply; in exchange, each patch's linear projection discards less fine-grained detail per token, which empirically tends to improve accuracy"
    - "Smaller patches produce a shorter sequence, which lowers self-attention's compute cost, but coarsens per-token detail and generally hurts accuracy on fine-grained recognition tasks"
    - "Patch size only affects the classification head's parameter count, and has no measurable effect on either sequence length or the amount of information folded into each token"
    - "Smaller patches always degrade accuracy regardless of dataset size, because the longer resulting sequence overwhelms the position-embedding table, which cannot represent more positions than it was originally initialized for"
  answer_index: 0
  explanation: "Halving patch size roughly quadruples the number of patches N = HW/P^2 at a fixed resolution, and self-attention's compute and memory cost scales quadratically in N, so smaller patches are noticeably more expensive to run. The upside is that each patch spans less raw pixel area, so its single linear projection has to compress less visual detail into one token, which empirically tends to improve accuracy (larger ViT variants like ViT-L/14 use smaller patches partly for this reason). This is the opposite tradeoff direction from the second option, patch size clearly does affect both sequence length and per-token information content (ruling out the third option), and position embeddings are interpolated to a new grid size rather than being a hard limit on sequence length (ruling out the fourth)."

- type: mcq
  question: "Visualizing what a ViT 'attends to' by plotting a single deep layer's raw [CLS]-to-patch attention weights can be misleading. What does attention rollout compute instead, and why is it considered more faithful for deep models?"
  choices:
    - "Attention rollout recursively multiplies attention matrices across all layers, adding an identity/skip term before each multiplication to account for residual connections, approximating how information actually propagates from input patches to the final [CLS] representation through the whole network rather than reflecting just one layer's weights"
    - "Attention rollout selects only the single attention head with the highest weight in the final layer and discards every other head and layer, producing a sharper but otherwise equivalent map to raw single-layer attention"
    - "Attention rollout retrains the model with an auxiliary loss that forces every layer's attention pattern to match the first layer's, making later layers directly comparable to raw single-layer attention"
    - "Attention rollout replaces attention weights with gradient-based saliency scores computed via backpropagation through the classification loss, and is unrelated to the attention weights themselves; it instead ranks patches purely by how much each one's pixels influence the loss when perturbed, independent of anything the attention mechanism computed during the forward pass"
  answer_index: 0
  explanation: "A single layer's raw attention weights only show what that one layer attends to, but a token's influence on the final [CLS] representation is shaped by every layer it passes through, combined with residual connections that let information skip past attention entirely at each layer. Attention rollout accounts for this by recursively multiplying attention matrices layer by layer, adding an identity term before each multiplication to represent the residual path, which approximates the full, multi-layer path information takes from an input patch to the final [CLS] output. This is a post-hoc computation over existing attention weights, not head selection, not a retraining procedure, and not a gradient-based saliency method."

- type: short
  question: "ViT is often pretrained at a lower resolution (e.g. 224x224) and then fine-tuned at a higher resolution (e.g. 384x384) for better accuracy. Increasing resolution while keeping patch size fixed increases the number of patches, so the pretrained 1D position-embedding table no longer has an entry for every new patch index. How does ViT handle this mismatch?"
  answer_keywords:
    - "reshaped into a 2D grid before interpolating"
    - "bilinearly interpolated to the new grid size"
    - "class token embedding is left unchanged"
  model_answer: "Because ViT's position embeddings are one learned vector per patch index at the pretraining resolution, fine-tuning at a higher resolution produces more patches than there are pretrained entries for. ViT resolves this by treating the pretrained patch position embeddings as a 2D grid rather than a flat sequence: they are reshaped into a 2D grid before interpolating, then bilinearly interpolated to the new grid size that matches the higher-resolution patch layout, and finally flattened back into a sequence. The class token embedding is left unchanged throughout this process, since there is always exactly one class token regardless of resolution; only the patch position embeddings need interpolating, and the rest of the network is then briefly fine-tuned so it adapts to the new, interpolated positions."
  explanation: "The pretrained position-embedding table has exactly one entry per patch position at the pretraining resolution's grid size, so a higher fine-tuning resolution (with the same patch size) simply produces more patches than there are pretrained embeddings to assign. ViT handles this with 2D interpolation: the sequence of pretrained patch position embeddings is reshaped back into its original 2D grid shape, bilinearly interpolated up to the new, larger grid size, and flattened back into a sequence matching the new patch count. The class token's embedding is untouched by this process since it is not part of the spatial grid. This lets a checkpoint pretrained at one resolution be reused at a higher fine-tuning resolution without discarding its learned positional structure."

- type: mcq
  question: "DeiT introduces a second learnable token, the distillation token, trained to match a teacher model's hard-label predictions, used alongside the usual [CLS] token trained on ground-truth labels. Why is this different from -- and reported to outperform -- simply averaging the student's and teacher's output logits at inference time?"
  choices:
    - "Logit averaging and the distillation token are mathematically identical operations; DeiT uses the token purely as an implementation convenience since it avoids running the teacher model a second time at inference"
    - "The distillation token removes the need for a teacher model entirely, since it is initialized from the teacher's final classification weights and then frozen for the rest of training"
    - "Logit averaging only works when teacher and student share identical architectures, and DeiT's distillation token was introduced solely to allow distilling from a different architecture family -- its one and only advantage over averaging, with no effect whatsoever on how the student's internal representations are shaped during training itself"
    - "The distillation token lets the student learn a representation specialized for mimicking the teacher through the same self-attention mechanism as the class token, interacting with the patch tokens throughout training itself, rather than only combining teacher and student outputs after both are already fully computed at inference"
  answer_index: 3
  explanation: "Averaging logits is a post-hoc combination applied only at the very end, after both models have independently finished their forward passes -- the student never actually learns anything shaped by the teacher's internal representations during training. DeiT's distillation token instead sits inside the transformer alongside the [CLS] token and the patch tokens, attending to and being attended to by the same layers throughout training, with its own loss term pulling it toward the teacher's hard-label predictions. This lets the student's internal representation actually be shaped by the distillation objective during learning, not just blended with the teacher's output afterward, which DeiT reports beats simple logit averaging. It does not eliminate the teacher, is not mathematically equivalent to averaging, and cross-architecture distillation (e.g. from a CNN teacher) is a benefit DeiT highlights but not the sole reason the token outperforms averaging."

- type: mcq
  question: "The 'Hybrid' ViT variant feeds the transformer encoder feature maps from a CNN stem (e.g. a ResNet's early stages) instead of patches cut directly from raw pixels. What changes about tokenization in this design, and what motivates it?"
  choices:
    - "The CNN stem entirely replaces the transformer encoder's self-attention layers, making Hybrid ViT functionally just a deeper CNN with its final pooled output relabeled as a [CLS] token"
    - "The CNN stem's output feature map is flattened spatially into a sequence of tokens in place of raw-pixel patches, letting the model start from features that already carry some of a CNN's local, translation-equivariant structure before the transformer's self-attention layers take over"
    - "The CNN stem is applied only to the [CLS] token's initial embedding, while every other patch token is still produced directly from raw pixels exactly as in the pure-patch variant"
    - "The CNN stem is used solely to downsample the input image's resolution before patchification, with no other effect on what information ends up inside each resulting patch token"
  answer_index: 1
  explanation: "In Hybrid ViT, the raw-pixel patch-and-linear-projection step is replaced by running the image through a CNN stem first; the resulting spatial feature map is then flattened into a sequence of tokens (with a linear projection into the transformer's embedding dimension) instead of tokens coming from flattened raw-pixel patches. The motivation is that the CNN stem's early convolutional layers already encode some locality and translation-equivariance structure, giving the transformer encoder a head start compared to learning everything from scratch off of raw-pixel patches, which can help particularly at smaller pretraining data scales. The transformer's self-attention layers are still present and unchanged (ruling out the first option), the CNN stem processes the full image rather than only feeding the [CLS] token (ruling out the third), and it changes the content of every token, not just image resolution (ruling out the fourth)."

- type: short
  question: "DeiT reaches strong ImageNet accuracy training only on ImageNet-1k, with no extra pretraining data, largely through a specific augmentation and regularization recipe. Name at least three techniques in this recipe and briefly say what each one does."
  answer_keywords:
    - "RandAugment applies a randomly chosen sequence"
    - "Mixup blends two training images"
    - "CutMix pastes a patch from one image"
    - "Stochastic depth randomly drops"
  model_answer: "DeiT's data-efficient training recipe combines several augmentation and regularization techniques so a ViT can be trained from scratch on ImageNet-1k alone. RandAugment applies a randomly chosen sequence of image transformations, such as rotation, shearing, and color adjustments, with randomized magnitude to each training image, increasing input diversity. Mixup blends two training images and their labels together in a weighted combination, encouraging smoother decision boundaries between classes. CutMix pastes a patch from one image directly onto another and mixes their labels in proportion to the patch area, forcing the model to rely on cues from multiple spatial regions instead of one dominant patch. Stochastic depth randomly drops entire transformer layers during training, replacing a dropped layer with the identity function for that step, acting as a strong regularizer similar in spirit to how dropout regularizes individual units. Together this heavier-than-usual augmentation and regularization stack substitutes for the large-scale pretraining data ViT would otherwise need."
  explanation: "The DeiT paper's central claim is that a ViT can match strong CNN accuracy training on ImageNet-1k alone -- no JFT-300M-scale pretraining -- if the training recipe is aggressive enough. Key ingredients include RandAugment (randomly composing image transformations with randomized magnitude per training image), Mixup (blending pairs of images and their labels), CutMix (pasting a rectangular patch from one image onto another and mixing labels by patch area), and stochastic depth (randomly skipping whole transformer layers during training, substituting the identity function for a dropped layer). Together with other choices like label smoothing and repeated augmentation, this recipe substitutes heavy regularization and data augmentation for the missing built-in inductive bias and missing pretraining scale, letting the data-hungry ViT architecture train well on a comparatively modest dataset."

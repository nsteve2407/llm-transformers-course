# _data/quizzes/08_efficient_transformers.yml
- type: mcq
  question: "FlashAttention is often described as an 'IO-aware' attention algorithm rather than one that reduces attention's FLOP count. What does this distinction actually mean, and why does it matter for GPU performance?"
  choices:
    - "FlashAttention reduces the total FLOP count by skipping the softmax normalization step for most query blocks and approximating the result there instead, with its IO-awareness arising only as a secondary side effect of having fewer operations left over that need any data movement at all once that step is gone"
    - "IO-awareness refers to reducing the number of parameters that must be transferred from GPU memory to the CPU during inference, which has nothing to do with the attention computation's arithmetic cost"
    - "FlashAttention performs roughly the same, or even slightly more, total floating-point operations as standard attention, but restructures the computation to minimize slow HBM reads and writes, which is what speeds it up since attention is bandwidth-bound, not compute-bound, on modern GPUs"
    - "FlashAttention achieves its speedup by running the entire attention computation inside GPU HBM, skipping the transfer to fast on-chip SRAM that other attention implementations rely on"
  answer_index: 2
  explanation: "FlashAttention does not reduce the number of floating-point operations attention requires -- if anything, its recomputation strategy in the backward pass adds some extra FLOPs. Its speedup comes entirely from restructuring the computation (via tiling) to drastically cut how much data moves between GPU HBM and fast on-chip SRAM, because on modern GPUs attention at typical sequence lengths is bottlenecked by memory bandwidth, not by arithmetic throughput -- the GPU's compute units sit idle waiting on memory traffic under the standard implementation. It does not skip softmax (softmax is still computed exactly, just incrementally via the online softmax trick), IO-awareness is about HBM/SRAM traffic rather than GPU/CPU transfer, and the whole point of tiling is to keep working blocks in SRAM rather than materializing everything in HBM -- the opposite of what the last option describes."

- type: short
  question: "FlashAttention never materializes the full N×N attention score matrix in GPU HBM. Describe how tiling combined with the online softmax technique makes this possible, including what running statistics online softmax must track and update across blocks."
  answer_keywords:
    - "blocks sized to fit in on-chip SRAM"
    - "running maximum and running sum"
    - "rescales the previously accumulated partial output"
  model_answer: "FlashAttention splits the query, key, and value matrices into blocks sized to fit in on-chip SRAM, then processes the score matrix one block at a time rather than computing all pairwise scores at once. Because an exact softmax needs a normalization constant computed over the entire row, online softmax instead maintains a running maximum and running sum for each query row as each new key/value block is processed; whenever a new block pushes the running maximum higher, the algorithm rescales the previously accumulated partial output and sum so the final result stays numerically stable and mathematically identical to a standard full-row softmax. This lets FlashAttention hold only one block's worth of scores in fast memory at a time and never write the full N×N matrix out to HBM."
  explanation: "Standard attention computes and stores the entire N×N score matrix before applying softmax and multiplying by V, which requires writing that whole matrix to HBM. FlashAttention avoids this by tiling: it loads small Q/K/V blocks into on-chip SRAM and computes attention incrementally, block by block. The catch is that softmax's denominator depends on every score in a row, which isn't fully known until all blocks are processed -- online softmax solves this by tracking a running max and running sum per row and correcting (rescaling) the partial output computed so far whenever a new block changes the running max, converging to the exact same result as computing softmax over the full row at once. This is what lets the full N×N matrix stay out of HBM entirely."

- type: mcq
  question: "FlashAttention's backward pass recomputes the attention probabilities for each block from Q, K, and V rather than reading them back from a stored N×N matrix produced during the forward pass. What motivates this recomputation strategy?"
  choices:
    - "The backward pass recomputes because the forward pass's tiling makes it structurally impossible to know afterward which blocks were adjacent to which, and no metadata about block boundaries or ordering is ever kept around after the forward pass finishes, so recomputation is treated as the only remaining way to determine what needs to be differentiated"
    - "Recomputation is used purely to save GPU memory capacity for storing gradients, and has no relationship to the HBM read/write bandwidth considerations that motivated tiling in the forward pass"
    - "Backward-pass FLOPs are strictly cheaper than forward-pass FLOPs for any attention implementation, so recomputing introduces no additional compute cost at all compared to storing the matrix"
    - "Storing the full N×N attention matrix from the forward pass would itself require exactly the large HBM read/write traffic FlashAttention was designed to avoid, so recomputing blocks cheaply from Q, K, and V already in SRAM keeps memory traffic low even though it adds some redundant FLOPs, a net win since attention is bandwidth-bound"
  answer_index: 3
  explanation: "Storing the O(N^2) attention matrix from the forward pass to reuse during backpropagation would reintroduce the very HBM traffic problem tiling was built to eliminate -- writing it out during the forward pass and reading it back during the backward pass. Instead, FlashAttention recomputes each block's attention probabilities on the fly during the backward pass directly from Q, K, and V (which are cheap to keep or reload), trading a modest amount of extra FLOPs for a much larger reduction in memory traffic -- a net win given that attention is bandwidth-bound. Block adjacency is not the issue (the same tiling scheme used forward is reused backward), the motivation is about HBM traffic rather than raw memory capacity for gradients, and the backward pass does add real recomputation FLOPs rather than being free."

- type: mcq
  question: "KV cache memory scales as roughly 2 × batch_size × seq_len × num_layers × num_heads × head_dim × bytes_per_value (the factor of 2 covers storing both keys and values). If a model's number of layers and sequence length are each doubled, with batch size, head count, and head dim held fixed, what happens to KV cache memory?"
  choices:
    - "It roughly doubles, since seq_len and num_layers are considered a single combined term in the formula and are only counted once no matter how many of the factors change"
    - "It roughly quadruples, because seq_len and num_layers are each independent multiplicative factors in the formula, so doubling both compounds into a 2×2 = 4× increase"
    - "It stays roughly constant, because the formula's dependence on sequence length is logarithmic rather than linear, and layer count is already amortized across the batch dimension"
    - "It increases by roughly 8×, because doubling sequence length also implicitly doubles the effective batch size the cache must account for"
  answer_index: 1
  explanation: "The formula's terms -- batch_size, seq_len, num_layers, num_heads, and head_dim -- are all independent multiplicative factors. Doubling any one of them doubles total KV cache memory on its own; doubling two of them at once compounds multiplicatively, giving 2 × 2 = 4× total memory here, not a single doubling. The dependence on seq_len is linear (the cache must hold one key/value pair per cached token per layer per head), not logarithmic, and batch size is a separate, independent factor that doubling seq_len does not touch."

- type: mcq
  question: "A model has 32 query heads. Configured with grouped-query attention using 8 KV heads, how many query heads share each KV head, and where does this configuration sit relative to standard multi-head attention (MHA) and multi-query attention (MQA)?"
  choices:
    - "Each KV head is shared by 4 query heads (32 divided by 8); this sits between full MHA (32 independent KV heads) and MQA (1 shared KV head), giving a KV cache 4× smaller than MHA's while retaining more per-head capacity than MQA's"
    - "Each KV head is shared by 8 query heads, putting this configuration much closer to MQA's single shared head than to MHA, with a KV cache only slightly larger than MQA's"
    - "This configuration is mathematically identical to MQA, since having fewer KV heads than query heads collapses to the same single-shared-head case regardless of how many KV heads remain"
    - "Each KV head is shared by 4 query heads, but grouping like this actually increases total KV cache size relative to MHA, since each group must store a separate duplicate copy of its shared KV head per member"
  answer_index: 0
  explanation: "32 query heads split across 8 KV heads means each KV head serves 32/8 = 4 query heads. GQA is explicitly a middle ground on the MHA-to-MQA spectrum: MHA is the extreme where every query head has its own KV head (32 KV heads here), MQA is the opposite extreme with a single KV head shared by all query heads, and GQA groups query heads so several share one KV head, landing between the two. With 8 KV heads instead of MHA's 32, the KV cache here is 4× smaller than full MHA's, while still being 8× larger than MQA's single-head cache -- a deliberate quality/memory tradeoff, not a case that collapses to MQA or that somehow inflates memory beyond MHA."

- type: short
  question: "GPTQ quantizes a pretrained model's weights layer by layer after training, with no retraining. How does it use approximate Hessian (second-order) information while quantizing each layer's weight matrix, and what does it do with the rounding error this produces?"
  answer_keywords:
    - "one column at a time"
    - "approximation to the layer's inverse Hessian"
    - "propagates that compensating update to the remaining columns"
  model_answer: "GPTQ quantizes each layer's weight matrix one column at a time. After rounding a column to its quantized grid, it uses an approximation to the layer's inverse Hessian, derived from statistics of the layer's input activations, to compute how that column's rounding error should be compensated for by adjusting the columns that haven't been quantized yet, and it propagates that compensating update to the remaining columns before moving on to quantize the next one. This greedily minimizes the layer's overall output reconstruction error instead of simply rounding every weight independently to its nearest quantized value."
  explanation: "Naively rounding every weight to the nearest representable quantized value independently ignores how weights interact to produce a layer's output, and accumulates avoidable error. GPTQ instead processes a weight matrix one column at a time: it quantizes a column, measures the resulting rounding error, and uses second-order (approximate inverse Hessian) information about the layer's input statistics to distribute a compensating correction across the still-unquantized columns, so their eventual rounding partially cancels out the error already introduced. Repeating this column by column keeps the layer's overall reconstruction error much lower than independent rounding would, while requiring no retraining or access to the original training data beyond a small calibration set."

- type: mcq
  question: "NF4 (NormalFloat4) is a 4-bit data type designed for quantizing neural network weights, used in QLoRA. What does 'normal' in NormalFloat refer to, and why does this make NF4 well suited to LLM weights specifically?"
  choices:
    - "NF4 normalizes activations to zero mean and unit variance before every matrix multiplication, and 'normal' in its name refers to this activation-normalization step rather than to anything about the weight distribution"
    - "NF4 spaces its representable values evenly across the full numeric range exactly like standard integer quantization does, and 'normal' simply indicates that it is the default, ordinary 4-bit format a popular quantization library happens to ship, with no deeper statistical meaning behind the choice of name at all beyond that branding"
    - "NF4's quantization levels are placed at the quantiles of a standard normal distribution rather than spaced evenly, so more of its representable values fall where a roughly normally-distributed set of pretrained weights actually has probability mass concentrated, reducing quantization error for that distribution shape"
    - "NF4 is 'normal' because it applies the identical quantization grid to both weights and activations uniformly, unlike LLM.int8(), which treats weights and activations asymmetrically"
  answer_index: 2
  explanation: "NF4's representable values are chosen to be quantiles of a standard normal distribution, rather than uniformly spaced across a numeric range the way a plain integer format would be. Because empirically, a trained neural network's weights within a layer tend to be roughly normally distributed around zero, placing more of NF4's limited set of representable values where that distribution actually puts probability mass gives lower quantization error for LLM weights than a uniformly-spaced grid of the same bit width would. This is unrelated to activation normalization (a separate, unrelated technique), and it is the opposite of evenly-spaced quantization -- NF4's entire design point is that its levels are not evenly spaced."

- type: mcq
  question: "GPTQ and NF4 are weight-only quantization schemes, while LLM.int8() also quantizes activations for the matrix multiply itself. What problem does quantizing activations create for LLM.int8(), and how does it address it?"
  choices:
    - "The large outliers actually occur in the weights rather than the activations in these models, so LLM.int8() quantizes weights in mixed precision while leaving all activations uniformly in int8"
    - "Quantizing activations to int8 is essentially lossless for transformers because activations are always bounded within a fixed small range by the preceding normalization layer, so no special handling of any activation dimension is needed"
    - "LLM.int8() sidesteps the outlier problem entirely by quantizing only weights, identical in scope to GPTQ and NF4, despite what its name suggests about activation quantization"
    - "Large-magnitude outlier features appear in a small number of activation dimensions in large transformer models; naively quantizing all activations to int8 would blow up error on exactly those dimensions, so LLM.int8() keeps outlier feature dimensions in fp16 and quantizes the rest to int8, then combines the two partial results"
  answer_index: 3
  explanation: "Large transformer models develop a small number of activation feature dimensions with unusually large magnitude ('outlier features'), concentrated in a handful of dimensions but present across many tokens. Quantizing these dimensions down to int8 alongside everything else would introduce large, damaging error precisely where precision matters most. LLM.int8() handles this with a mixed-precision decomposition: it identifies the outlier feature dimensions per matmul, computes those in fp16 while quantizing the remaining, well-behaved dimensions to int8, and combines the two partial products back together. The outliers are an activation phenomenon (not primarily a weight phenomenon), activations are not reliably bounded to a small range regardless of normalization, and mixed precision -- not uniform weight-only quantization -- is the actual mechanism LLM.int8() uses."

- type: short
  question: "RoPE gives attention a clean relative-position property, yet models trained with RoPE still degrade sharply on sequences longer than any length seen during training. Why does this happen, given that RoPE's rotation angle is a well-defined function for any position?"
  answer_keywords:
    - "never learned what to do with"
    - "out-of-distribution rotation angles"
    - "fall outside the distribution"
  model_answer: "Even though RoPE's rotation angle is mathematically well-defined for any position, the model's attention layers were only ever optimized on the specific range of relative offsets, and the resulting rotation angles, that actually occurred during training. At relative offsets longer than any seen in training, the query-key dot product patterns fall outside the distribution of angles the model learned to interpret, producing out-of-distribution rotation angles the model has never learned what to do with -- so attention scores behave unpredictably at those offsets even though the underlying rotation formula still returns a perfectly valid number. The formula extrapolates cleanly; the trained model's learned behavior does not."
  explanation: "RoPE's rotation is a closed-form function that can technically be evaluated at any relative offset, including ones never encountered during training. But the model's weights were fit to work well specifically with the query-key dot-product patterns produced by the relative offsets it actually saw during training. Offsets beyond the trained maximum produce rotation angles, and downstream attention score patterns, that the model never adjusted its parameters to handle -- they are out-of-distribution relative to training, so the resulting attention behavior degrades sharply even though nothing about the rotation formula itself breaks. This gap between 'the formula extrapolates' and 'the trained model generalizes' is exactly what techniques like position interpolation and YaRN are designed to close."

- type: mcq
  question: "Naive position interpolation rescales every RoPE rotation angle by the same linear factor to extend context length. YaRN instead treats RoPE's low-frequency and high-frequency dimensions differently. What distinction does YaRN draw, and why?"
  choices:
    - "YaRN interpolates high-frequency dimensions more aggressively than low-frequency ones, reasoning that high-frequency dimensions carry the most redundant information and have the most room to compress without losing anything"
    - "YaRN observes that low-frequency dimensions (which encode coarse, long-range position information) tolerate naive interpolation well, while high-frequency dimensions (fine-grained local position) lose precision under uniform rescaling, so YaRN interpolates high-frequency dimensions less aggressively than low-frequency ones"
    - "YaRN applies naive linear interpolation only within the very first attention layer's RoPE dimensions, leaving every other layer's rotation angles completely unscaled"
    - "YaRN removes RoPE's per-dimension frequency structure entirely, replacing all rotation angles with one learned scalar shared across every dimension regardless of index"
  answer_index: 1
  explanation: "RoPE's dimensions span a range of frequencies (wavelengths): low-frequency dimensions rotate slowly and encode coarse, long-range positional relationships, while high-frequency dimensions rotate quickly and encode fine-grained local position. Naive linear interpolation rescales every dimension's rotation angle by the same factor, which compresses high-frequency dimensions past the point where nearby positions remain distinguishable, hurting local precision, while low-frequency dimensions are relatively unaffected since they change slowly anyway. YaRN's NTK-aware scheme responds by interpolating high-frequency dimensions less aggressively (preserving local resolution) and low-frequency dimensions more aggressively (where it's safe to do so), rather than one uniform factor. This is not about compressing high-frequency dimensions more, restricting scaling to a single layer, or discarding per-dimension frequency structure in favor of one global scalar."
